<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F6F5F1">
<title>Zadania</title>
<style>
:root{--tlo:#F6F5F1;--karta:#FFFFFF;--tekst:#1C1C1A;--szary:#57564F;--linia:#D6D4CC;--linia2:#ECEAE3;--akcent:#0F766E;--akcent2:#134E4A;--akcentj:#E6F2F0;--pom:#9A3412;--pomj:#FFF1E6;--zle:#B42318}
@media (prefers-color-scheme:dark){:root{--tlo:#161614;--karta:#22221F;--tekst:#F2F1EC;--szary:#B5B3AA;--linia:#45443F;--linia2:#33322E;--akcent:#2BA597;--akcent2:#A7E3DB;--akcentj:#173A36;--pom:#F4A06B;--pomj:#3A2416;--zle:#F97066}}
*{box-sizing:border-box}
body{margin:0;background:var(--tlo);color:var(--tekst);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:26px;margin:4px 0 2px}h2{font-size:20px;margin:0}h3{font-size:13px;font-weight:600;color:var(--szary);margin:18px 0 8px;text-transform:none}
.mal{font-size:13px;color:var(--szary)}
.karta{background:var(--karta);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.karta.wazna{border:2px solid var(--akcent)}
.wiersz{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pigu{border-radius:999px;padding:5px 11px;font-weight:700;font-size:13px;white-space:nowrap;background:var(--pomj);color:var(--pom)}
.pigu.ok{background:var(--akcentj);color:var(--akcent2)}
.pigu.zle{background:transparent;border:1px solid var(--zle);color:var(--zle)}
.pasek{height:10px;border-radius:999px;background:var(--linia2);overflow:hidden}.pasek>div{height:100%;background:var(--akcent);border-radius:999px}
button,.btn{font:inherit;font-weight:600;min-height:46px;border-radius:12px;border:1px solid var(--linia);background:var(--karta);color:var(--tekst);padding:0 14px;cursor:pointer}
button.glowny{background:var(--akcent);border-color:var(--akcent);color:#fff;font-weight:700;width:100%;min-height:52px}
button.wyb{border:2px solid var(--akcent);background:var(--akcentj);color:var(--akcent2)}
button:disabled{opacity:.5}
.rzad{display:flex;gap:8px;flex-wrap:wrap}.rzad>*{flex:1}
.siatka{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.pole{display:block;font-size:13px;font-weight:600;color:var(--szary);margin:12px 0 6px}
input[type=text],input[type=number],input[type=datetime-local],input[type=time],textarea,select{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--linia);background:var(--karta);color:var(--tekst);padding:10px 14px;font:inherit}
textarea{min-height:70px;resize:vertical}
.krok{display:flex;align-items:center;gap:10px;min-height:40px}
.krok input{width:22px;height:22px;accent-color:var(--akcent)}
.zdj{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.zdj img{width:100%;height:160px;object-fit:cover;border-radius:12px;background:var(--linia2)}
.zdj .pusto{height:160px;border-radius:12px;background:var(--linia2);display:flex;align-items:center;justify-content:center;color:var(--szary);font-size:13px;text-align:center;padding:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--karta);border-top:1px solid var(--linia2);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;max-width:140px;text-align:center;padding:10px 4px 12px;color:var(--szary);text-decoration:none;font-size:12px;font-weight:600;min-height:56px}
nav a.akt{color:var(--akcent)}
nav a .lic{background:var(--pom);color:#fff;border-radius:999px;padding:0 6px;font-size:11px;margin-left:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:var(--tekst);color:var(--tlo);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%;z-index:9}
.ok-ic{color:var(--akcent)}.uw-ic{color:var(--pom)}
.wpis{display:flex;gap:10px;align-items:flex-start;margin:6px 0}
.lista>.karta:last-child{margin-bottom:0}
.prawo{display:flex;gap:6px}
.prawo label{display:flex;align-items:center;gap:4px;font-size:13px;min-height:36px}
a{color:var(--akcent)}
.ukryj{display:none}
</style>
</head>
<body>
<main id="app"><p class="mal">Ładuję…</p></main>
<nav id="nav"></nav>
<div id="toast" class="toast ukryj" role="status"></div>
<script>
"use strict";
let S = null, widok = location.hash.slice(1) || "", dzieckoWyb = null, czekaOdp = false;
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const IK = {
  ok:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  uw:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>',
  aparat:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/></svg>',
  gw:'<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M12 2l3 7h7l-5.5 4.5 2 7.5-6.5-4.5-6.5 4.5 2-7.5L2 9h7z"/></svg>'
};
const WER = {zdjecie:"Zdjęcie po", zeszyt:"Zdjęcie zeszytu", minutnik:"Minutnik", zaufanie:"Na zaufanie"};
const PORA = {"":"W ciągu dnia", rano:"Poranek", popoludnie:"Popołudnie", wieczor:"Wieczór"};
const STAN = {do_zrobienia:"do zrobienia", wyslane:"czeka na zatwierdzenie", zatwierdzone:"zatwierdzone", czesciowo:"częściowo", do_poprawki:"do poprawki"};
const WERD = {zrobione:["zrobione","ok"], raczej_zrobione:["raczej zrobione","ok"], niepewne:["niepewne",""], nie_zrobione:["nie widać efektu","zle"]};
const DNI = ["Pn","Wt","Śr","Cz","Pt","So","Nd"];

function toast(t){ const e=$("#toast"); e.textContent=t; e.classList.remove("ukryj"); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.add("ukryj"),3500); }
async function api(sc, dane, typ){
  const o = dane===undefined ? {} : {method:"POST", headers:{"Content-Type": typ||"application/json"}, body: typ ? dane : JSON.stringify(dane)};
  const r = await fetch(sc, o); let j = {};
  try { j = await r.json(); } catch(e) {}
  if (!r.ok) { const er = new Error(j.blad || ("Błąd " + r.status)); er.dane = j; er.kod = r.status; throw er; }
  return j;
}
async function odswiez(){
  try { S = await api("api/stan"); rysuj(); }
  catch(e){
    $("#nav").innerHTML = "";
    if (e.kod===401) { S = null; return logowanie(); }
    $("#app").innerHTML = '<div class="karta">'+esc(e.message)+'</div>';
  }
}
/* ---------- logowanie i PIN ---------- */
let L = {osoby:[], wyb:null, przez_ha:false};
async function logowanie(){
  if (document.activeElement && document.activeElement.id==="lpin") return;
  try { const r = await api("api/logowanie"); L.osoby = r.osoby; L.przez_ha = r.przez_ha; L.konto = r.konto_ha; } catch(e) {}
  const m = location.hash.match(/^#zaloguj-(\d+)$/);
  if (m) L.wyb = +m[1];
  rysujLogowanie();
}
function rysujLogowanie(){
  const o = L.osoby.find(x => x.id===L.wyb);
  let h = '<h1>Zadania</h1><p class="mal">'+(L.przez_ha ? "Konto Home Assistant „"+esc(L.konto)+"” nie jest jeszcze przypisane do nikogo w Zadaniach. Poproś administratora o przypisanie (Osoby → Konto HA) albo wybierz siebie i wpisz swój PIN – wtedy połączy się samo." : "Kim jesteś?")+'</p>';
  h += '<div class="siatka">' + L.osoby.map(x => '<button data-kto="'+x.id+'" class="'+(x.id===L.wyb?"wyb":"")+'">'+esc(x.imie)+'</button>').join("") + '</div>';
  if (o && o.ma_pin) h += '<label class="pole" for="lpin">PIN</label><input type="password" id="lpin" inputmode="numeric" autocomplete="current-password" maxlength="6"><div style="margin-top:12px"><button class="glowny" id="lzal">Wejdź</button></div><p class="mal">Nie pamiętasz PIN-u? Poproś opiekuna albo administratora o skasowanie – potem ustawisz nowy.</p>';
  else if (o) h += '<div class="karta" style="margin-top:12px">'+esc(o.imie)+' nie ma jeszcze PIN-u. Otwórz swój osobisty link (dostaniesz go od administratora) i ustaw PIN.</div>';
  if (!L.osoby.length) h += '<div class="karta">Nie ma jeszcze żadnej osoby. Administratora dodaje instalator.</div>';
  $("#app").innerHTML = h;
  $("#app").querySelectorAll("[data-kto]").forEach(e => e.onclick = () => { L.wyb = +e.dataset.kto; rysujLogowanie(); if ($("#lpin")) $("#lpin").focus(); });
  const wejdz = async () => { try { await api("api/zaloguj", {osoba_id:L.wyb, pin:$("#lpin").value}); if (/^#zaloguj/.test(location.hash)) history.replaceState(null, "", location.pathname); widok = ""; await odswiez(); } catch(e) { toast(e.message); $("#lpin").value = ""; } };
  if ($("#lzal")) { $("#lzal").onclick = wejdz; $("#lpin").onkeydown = ev => { if (ev.key==="Enter") wejdz(); }; }
}
function widokPin(wymuszony){
  const stary = S.ja.ma_pin && !S.ja.przez_ha;
  return '<h1>'+(wymuszony?"Ustaw swój PIN":"Zmień PIN")+'</h1><p class="mal">'+(wymuszony?"Cześć, "+esc(S.ja.imie)+"! Wymyśl PIN (4–6 cyfr). Będziesz nim wchodzić do aplikacji.":"PIN to 4–6 cyfr.")+'</p>'
    + (stary ? '<label class="pole" for="pst">Obecny PIN</label><input type="password" id="pst" inputmode="numeric" maxlength="6">' : "")
    + '<label class="pole" for="pn1">Nowy PIN</label><input type="password" id="pn1" inputmode="numeric" autocomplete="new-password" maxlength="6">'
    + '<label class="pole" for="pn2">Powtórz PIN</label><input type="password" id="pn2" inputmode="numeric" autocomplete="new-password" maxlength="6">'
    + '<div style="margin-top:14px"><button class="glowny" id="pzap">Zapisz PIN</button></div>'
    + (wymuszony ? "" : '<div style="margin-top:8px"><a href="#">Wróć</a></div>');
}
function stopka(){
  return '<p class="mal" style="text-align:center;margin-top:28px">'+esc(S.ja.imie)+' · <a href="#pin">Zmień PIN</a> · <a href="#" id="wyloguj">'+(S.ja.przez_ha?"Odłącz to konto":"Wyloguj")+'</a> · wersja '+esc(S.wersja)+'</p>';
}
async function akcja(sc, dane, msg, typ){
  if (czekaOdp) return; czekaOdp = true;
  try { const r = await api(sc, dane, typ); if (msg) toast(msg); await odswiez(); return r; }
  catch(e){ toast(e.message); throw e; }
  finally { czekaOdp = false; }
}
function idz(w){ location.hash = w; }
window.addEventListener("hashchange", () => { widok = location.hash.slice(1); rysuj(); scrollTo(0,0); });

const dziecko = () => S.ja.rola === "dziecko";
const dz = id => S.dzieci.find(d => d.id === id) || {imie:"?"};
const czas = s => s ? s.slice(11,16) : "";
function kiedy(s){
  if (!s) return "";
  const d = s.slice(0,10), dzis = S.dzis;
  const jutro = new Date(Date.parse(dzis+"T12:00:00")+864e5).toISOString().slice(0,10);
  return (d===dzis ? "dziś" : d===jutro ? "jutro" : d.slice(8,10)+"."+d.slice(5,7)) + " " + czas(s);
}
function zostalo(s){
  if (!s) return "";
  const m = Math.round((Date.parse(s) - Date.parse(S.teraz)) / 60000);
  if (m < 0) return "po terminie";
  if (m < 60) return "jeszcze " + m + " min";
  const h = Math.floor(m/60);
  return h < 24 ? "jeszcze " + h + " h " + (m%60) + " min" : "do " + kiedy(s);
}
const doZatw = () => S.zadania.filter(z => z.stan==="wyslane" && dz(z.dziecko_id).prawa?.zatwierdza).length
  + S.wymiany.filter(w => w.stan==="czeka" && dz(w.dziecko_id).prawa?.zatwierdza).length
  + S.nagrody.filter(n => n.stan==="propozycja" && dz(n.dziecko_id).prawa?.zatwierdza).length;

function rysujNav(){
  let p;
  if (dziecko()) p = [["","Dziś"],["pula","Pula"],["nagrody","Nagrody"]];
  else { p = [["","Zatwierdź"],["zlec","Zleć"],["dzieci","Dzieci"],["nagrody","Nagrody"]]; if (S.ja.admin) p.push(["osoby","Osoby"]); }
  const n = dziecko() ? 0 : doZatw();
  $("#nav").innerHTML = p.map(([h,t]) => '<a href="#'+h+'" class="'+((widok===h || (h==="" && /^z\d/.test(widok)))?"akt":"")+'">'+t+(h==="" && n ? ' <span class="lic">'+n+'</span>' : "")+'</a>').join("");
}

function rysuj(){
  if (!S) return;
  if (!S.ja.ma_pin) { $("#nav").innerHTML = ""; $("#app").innerHTML = widokPin(true); return podepnij(); }
  rysujNav();
  const m = widok.match(/^z(\d+)$/);
  let h;
  if (widok==="pin") h = widokPin(false);
  else if (m) h = widokZadania(+m[1]);
  else if (dziecko()) h = widok==="pula" ? widokPula() : widok==="nagrody" ? widokNagrody() : widokDzis();
  else h = widok==="zlec" ? widokZlec() : widok==="dzieci" ? widokDzieci() : widok==="nagrody" ? widokNagrody() : widok==="osoby" && S.ja.admin ? widokOsoby() : widokZatwierdz();
  $("#app").innerHTML = h + (widok==="pin" ? "" : stopka());
  podepnij();
}

/* ---------- dziecko ---------- */
function widokDzis(){
  const ja = S.dzieci[0] || {saldo:0, seria:0};
  const moje = S.zadania.filter(z => !z.pula);
  const dzis = moje.filter(z => z.dzien === S.dzis || ["do_zrobienia","do_poprawki"].includes(z.stan));
  const d = new Date(Date.parse(S.dzis+"T12:00:00"));
  let h = '<div class="wiersz"><div><div class="mal">'+d.toLocaleDateString("pl-PL",{weekday:"long", day:"numeric", month:"long"})+'</div><h1>Cześć, '+esc(S.ja.imie)+'</h1></div><span class="pigu">'+IK.gw+' '+(ja.saldo-ja.zarezerwowane)+' pkt</span></div>';
  for (const pora of ["rano","popoludnie","wieczor"]) {
    const r = dzis.filter(z => z.pora===pora && z.dzien===S.dzis);
    if (!r.length) continue;
    const zr = r.filter(z => z.stan!=="do_zrobienia" && z.stan!=="do_poprawki").length;
    h += '<div class="karta" style="margin-top:12px"><div class="wiersz"><b>'+PORA[pora]+'</b><b class="ok-ic">'+zr+' z '+r.length+'</b></div><div class="pasek" style="margin:10px 0"><div style="width:'+Math.round(100*zr/r.length)+'%"></div></div>'
      + r.map(z => '<div class="wiersz" style="min-height:40px"><a href="#z'+z.id+'">'+esc(z.tytul)+'</a><span class="mal">'+(z.stan==="do_zrobienia"?"":STAN[z.stan])+'</span></div>').join("")
      + (ja.seria ? '<div class="mal">Seria: '+ja.seria+' dni z rzędu.</div>' : "") + '</div>';
  }
  const reszta = dzis.filter(z => !z.pora || z.dzien!==S.dzis);
  h += '<h3>Na dziś</h3>';
  if (!reszta.length) h += '<div class="karta mal">Nic więcej na dziś. Możesz wziąć coś z puli.</div>';
  h += '<div class="lista">' + reszta.map((z,i) => kartaDziecka(z, i===0 && ["do_zrobienia","do_poprawki"].includes(z.stan))).join("") + '</div>';
  return h;
}
function kartaDziecka(z, rozwin){
  const otw = ["do_zrobienia","do_poprawki"].includes(z.stan);
  let h = '<div class="karta '+(rozwin?"wazna":"")+'"><div class="wiersz" style="align-items:flex-start"><div><a href="#z'+z.id+'" style="font-size:18px;font-weight:700;color:inherit;text-decoration:none">'+esc(z.tytul)+'</a><div class="mal">'+(z.zleca?"od: "+esc(z.zleca)+" · ":"")+z.punkty+' pkt · '+WER[z.weryfikacja].toLowerCase()+'</div></div>'
    + (otw ? '<span class="pigu '+(z.po_terminie?"zle":"")+'">'+zostalo(z.termin)+'</span>' : '<span class="pigu ok">'+STAN[z.stan]+'</span>') + '</div>';
  if (z.stan==="do_poprawki" && z.slowo) h += '<div class="wpis uw-ic">'+IK.uw+'<span style="color:var(--tekst)">'+esc(z.slowo)+'</span></div>';
  if (rozwin) h += kroki(z) + '<div style="margin-top:10px"><a class="btn glowny" style="display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;background:var(--akcent);color:#fff;border-radius:12px;min-height:50px" href="#z'+z.id+'">'+(z.weryfikacja==="minutnik"?"Otwórz minutnik":z.weryfikacja==="zaufanie"?"Zrobione":IK.aparat+" Zrobione – zrób zdjęcie")+'</a></div>';
  if ((z.stan==="zatwierdzone"||z.stan==="czesciowo") && z.slowo) h += '<div class="mal" style="margin-top:6px">'+esc(z.zatwierdzil)+': „'+esc(z.slowo)+'”</div>';
  return h + '</div>';
}
function kroki(z, tylkoOdczyt){
  if (!z.kroki.length) return S.ai && z.stan==="do_zrobienia" ? '<div class="mal" style="margin-top:6px">Kroki pojawią się za chwilę.</div>' : "";
  return '<div style="margin-top:8px">' + z.kroki.map((k,i) => '<label class="krok"><input type="checkbox" data-krok="'+z.id+':'+i+'" '+(k.z?"checked":"")+' '+(tylkoOdczyt?"disabled":"")+'>'+esc(k.t)+'</label>').join("") + '</div>';
}
function widokPula(){
  const p = S.zadania.filter(z => z.pula);
  return '<h1>Pula zadań</h1><p class="mal">Weź coś dodatkowo – za punkty.</p>' + (p.length ? p.map(z => '<div class="karta"><div class="wiersz"><div><b>'+esc(z.tytul)+'</b><div class="mal">'+z.punkty+' pkt · '+WER[z.weryfikacja].toLowerCase()+'</div>'+(z.opis?'<div class="mal">'+esc(z.opis)+'</div>':"")+'</div><button data-wez="'+z.id+'">Biorę</button></div></div>').join("") : '<div class="karta mal">Pula jest pusta.</div>');
}

/* ---------- jedno zadanie ---------- */
function widokZadania(id){
  const z = S.zadania.find(x => x.id === id);
  if (!z) return '<div class="karta">Tego zadania już nie ma na liście. <a href="#">Wróć</a></div>';
  const ja = dziecko(), d = dz(z.dziecko_id);
  const przed = z.zdjecia.filter(p => p.rodzaj==="przed").slice(-1)[0], po = z.zdjecia.filter(p => p.rodzaj==="po");
  const otw = ["do_zrobienia","do_poprawki"].includes(z.stan) && !z.pula;
  let h = '<div class="wiersz" style="justify-content:flex-start"><a class="btn" href="#" aria-label="Wstecz" style="display:flex;align-items:center;width:46px;justify-content:center">&#8592;</a><div><h2>'+esc(z.tytul)+'</h2><div class="mal">'+(ja?"":esc(d.imie)+" · ")+(z.zleca?"zleca "+esc(z.zleca)+" · ":"")+z.punkty+' pkt · '+(z.termin?"termin "+kiedy(z.termin):"bez terminu")+'</div></div></div>';
  h += '<div class="karta" style="margin-top:12px"><div class="wiersz"><span class="pigu '+(z.stan==="zatwierdzone"?"ok":z.po_terminie?"zle":"")+'">'+(z.po_terminie?"po terminie":STAN[z.stan])+'</span><span class="mal">'+WER[z.weryfikacja]+'</span></div>'
    + (z.opis ? '<p style="margin:10px 0 0">'+esc(z.opis)+'</p>' : "") + kroki(z, !ja || !otw) + '</div>';
  if (z.slowo) h += '<div class="karta"><div class="mal">'+esc(z.zatwierdzil || "Rodzic")+'</div>'+esc(z.slowo)+'</div>';
  // zdjęcia
  if (z.weryfikacja!=="minutnik" || z.zdjecia.length) {
    const pokPo = po.slice(-1)[0];
    h += '<div class="zdj"><div><div class="mal">Przed</div>'+(przed?'<img src="api/zdjecie/'+przed.id+'" alt="Zdjęcie przed">':'<div class="pusto">'+(ja&&otw?"możesz dodać":"brak")+'</div>')+'</div>'
      + '<div><div class="mal">Po'+(po.length>1?" ("+po.length+")":"")+'</div>'+(pokPo?'<img src="api/zdjecie/'+pokPo.id+'" alt="Zdjęcie po">':'<div class="pusto">'+(ja&&otw?"zrób zdjęcie":"brak")+'</div>')+'</div></div>';
    if (ja && otw) h += '<div class="rzad"><label class="btn" style="display:flex;align-items:center;justify-content:center">Przed<input type="file" accept="image/*" capture="environment" data-foto="'+z.id+':przed" class="ukryj"></label><label class="btn" style="display:flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--akcent)">'+IK.aparat+' Po<input type="file" accept="image/*" capture="environment" data-foto="'+z.id+':po" class="ukryj"></label>'+(pokPo?'<button data-usunfoto="'+pokPo.id+'">Usuń ostatnie</button>':"")+'</div>';

  // ocena AI

      + z.ocena.punkty.map(p => '<div class="wpis '+(p.ok?"ok-ic":"uw-ic")+'">'+(p.ok?IK.ok:IK.uw)+'<span style="color:var(--tekst)">'+esc(p.tekst)+'</span></div>').join("")
      + (ja && z.ocena.dla_dziecka ? '<div class="mal">'+esc(z.ocena.dla_dziecka)+'</div>' : "")
      + (ja ? '<div class="mal">Możesz poprawić i zrobić zdjęcie jeszcze raz albo wysłać tak.</div>' : '<div class="mal">AI tylko podpowiada. Decyzja należy do Ciebie.</div>') + '</div>';
  } else if (z.ocena_stan==="blad" && !ja) h += '<div class="karta mal">Ocena AI się nie udała – oceń sam.</div>';
  if (z.komentarz) h += '<div class="karta"><div class="mal">'+(ja?"Twój komentarz":"Komentarz: "+esc(d.imie))+'</div>„'+esc(z.komentarz)+'”</div>';

      if (!z.start) h += '<button class="glowny" data-start="'+z.id+'">Start minutnika · '+z.minuty+' min</button>';
      else h += '<div class="karta" style="text-align:center"><div class="mal">Minutnik</div><div id="minutnik" data-koniec="'+(Date.parse(z.start)+z.minuty*60000)+'" style="font-size:40px;font-weight:700">…</div></div>';
    }
    h += '<label class="pole" for="kom">Chcesz coś dopisać?</label><input type="text" id="kom" maxlength="300" value="">'
      + '<div class="mal" style="text-align:center;margin:12px 0 8px">Zdjęcie zostaje w domu. Decyduje rodzic.</div><button class="glowny" data-wyslij="'+z.id+'">Wyślij</button>';
  }
  if (z.pula && ja) h += '<button class="glowny" data-wez="'+z.id+'">Biorę to zadanie</button>';
  // akcje rodzica
  if (!ja && z.stan==="wyslane" && d.prawa?.zatwierdza) {
    h += '<label class="pole" for="slowo">Słowo do dziecka (zobaczy je przy zadaniu)</label><input type="text" id="slowo" maxlength="300" placeholder="np. Super, dziękuję!">'
      + '<div style="margin-top:12px"><button class="glowny" data-dec="'+z.id+':zatwierdz">Zatwierdź · +'+z.punkty+' pkt</button></div>'
      + '<div class="rzad" style="margin-top:8px"><button data-dec="'+z.id+':poprawka">Do poprawki</button><button data-dec="'+z.id+':czesciowo">Częściowo · +'+Math.floor(z.punkty/2)+'</button></div>';

  if (!ja && d.prawa?.zleca && !["zatwierdzone","czesciowo"].includes(z.stan)) h += '<div style="margin-top:20px"><button data-usunzad="'+z.id+'" style="width:100%;color:var(--zle)">Usuń zadanie</button></div>';
  return h;
}

/* ---------- rodzic ---------- */
function widokZatwierdz(){
  const z = S.zadania.filter(x => x.stan==="wyslane" && dz(x.dziecko_id).prawa?.zatwierdza);
  const w = S.wymiany.filter(x => x.stan==="czeka" && dz(x.dziecko_id).prawa?.zatwierdza);
  const n = S.nagrody.filter(x => x.stan==="propozycja" && dz(x.dziecko_id).prawa?.zatwierdza);
  let h = '<h1>Do zatwierdzenia</h1><p class="mal">Cześć, '+esc(S.ja.imie)+'.</p>' + pierwszeKroki();
  if (!z.length && !w.length && !n.length) h += '<div class="karta mal">Nic nie czeka. Tu pojawi się zadanie, gdy dziecko je wyśle.</div>';
  h += z.map(x => {
    const po = x.zdjecia.filter(p => p.rodzaj==="po").slice(-1)[0];
    const wd = x.ocena && x.ocena.werdykt ? WERD[x.ocena.werdykt] : null;
    const szybko = !po && x.weryfikacja!=="zdjecie" && x.weryfikacja!=="zeszyt";
    return '<div class="karta"><a href="#z'+x.id+'" style="display:flex;gap:12px;align-items:center;color:inherit;text-decoration:none">'+(po?'<img src="api/zdjecie/'+po.id+'" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:10px">':"")+'<div style="flex:1"><b>'+esc(dz(x.dziecko_id).imie)+': '+esc(x.tytul)+'</b><div class="mal">wysłane '+kiedy(x.wyslane)+' · '+x.punkty+' pkt</div></div>'+(wd?'<span class="pigu '+wd[1]+'">'+wd[0]+'</span>':x.ocena_stan==="czeka"?'<span class="mal">AI…</span>':"")+'</a>'
      + (szybko ? '<div class="rzad" style="margin-top:10px"><button data-dec="'+x.id+':poprawka">Do poprawki</button><button class="wyb" data-dec="'+x.id+':zatwierdz">Zatwierdź · +'+x.punkty+' pkt</button></div>' : '<div class="mal" style="margin-top:6px">Dotknij, żeby obejrzeć zdjęcie i zatwierdzić.</div>') + '</div>';
  }).join("");
  if (w.length) h += '<h3>Wymiana punktów</h3>' + w.map(x => '<div class="karta"><b>'+esc(dz(x.dziecko_id).imie)+': '+esc(x.nazwa)+'</b><div class="mal">'+x.koszt+' pkt · ma '+dz(x.dziecko_id).saldo+'</div><div class="rzad" style="margin-top:8px"><button data-wym="'+x.id+':nie">Jeszcze nie</button><button class="wyb" data-wym="'+x.id+':tak">Zgoda</button></div></div>').join("");
  if (n.length) h += '<h3>Propozycje nagród</h3>' + n.map(x => '<div class="karta"><b>'+esc(dz(x.dziecko_id).imie)+': '+esc(x.nazwa)+'</b><div class="mal">proponuje '+x.koszt+' pkt'+(x.cel?" · jako duży cel":"")+'</div><div class="rzad" style="margin-top:8px"><button data-nagr="'+x.id+':nie">Nie</button><button class="wyb" data-nagr="'+x.id+':tak">Dodaj</button></div></div>').join("");
  const dzis = S.zadania.filter(x => x.dzien===S.dzis && !x.pula);
  if (dzis.length) h += '<h3>Dziś u dzieci</h3>' + S.dzieci.map(d => { const r = dzis.filter(x => x.dziecko_id===d.id); if (!r.length) return ""; const zr = r.filter(x => !["do_zrobienia","do_poprawki"].includes(x.stan)).length; return '<div class="karta"><div class="wiersz"><b>'+esc(d.imie)+'</b><span class="mal">'+zr+' z '+r.length+'</span></div><div class="pasek" style="margin-top:8px"><div style="width:'+Math.round(100*zr/r.length)+'%"></div></div>'+r.filter(x=>x.po_terminie).map(x=>'<div class="mal uw-ic" style="margin-top:6px">po terminie: <a href="#z'+x.id+'">'+esc(x.tytul)+'</a></div>').join("")+'</div>'; }).join("");
  return h;
}
function pierwszeKroki(){
  if (!S.ja.admin || !S.osoby) return "";
  const kroki = [
    [S.osoby.some(o => o.rola==="dziecko"), "Dodaj dzieci i opiekunów", "osoby"],
    [S.dzieci.length > 0 && S.dzieci.some(d => d.prawa.zleca), "Zaznacz, kto komu zleca i zatwierdza", "osoby"],
    [S.zadania.length > 0 || (S.szablony||[]).length > 0, "Zleć pierwsze zadanie", "zlec"],
    [S.nagrody.length > 0, "Dodaj nagrodę albo duży cel", "nagrody"],
    [S.ha, "Włącz powiadomienia (dodatek w Home Assistant)", "osoby"]];
  if (kroki.every(k => k[0])) return "";
  return '<div class="karta wazna"><b>Pierwsze kroki</b>' + kroki.map(([ok,t,h]) => '<div class="wiersz" style="min-height:40px"><span>'+(ok?IK.ok:"○")+' '+(ok?'<span class="mal">'+t+'</span>':'<a href="#'+h+'">'+t+'</a>')+'</span></div>').join("") + '</div>';
}
let F = {dziecko:null, wer:"zdjecie", pora:"", dni:"", pula:false, wiecej:false, aikroki:false};

   + '<label class="pole">Jak potwierdzi, że zrobione</label><div class="siatka">'+Object.keys(WER).map(k => '<button data-f="wer:'+k+'" class="'+(F.wer===k?"wyb":"")+'">'+WER[k]+'</button>').join("")+'</div>'

   + '<div class="rzad" style="margin-top:8px">'+DNI.map((t,i) => '<button data-dzien="'+(i+1)+'" class="'+(F.dni.includes(String(i+1))?"wyb":"")+'" style="min-width:0;padding:0">'+t+'</button>').join("")+'</div>'
   + '<label class="pole">Pora dnia (do rutyny porannej albo wieczornej)</label><div class="siatka">'+Object.keys(PORA).map(k => '<button data-f="pora:'+k+'" class="'+(F.pora===k?"wyb":"")+'">'+PORA[k]+'</button>').join("")+'</div>'
   + (F.dni ? "" : '<label class="krok" style="margin-top:10px"><input type="checkbox" id="pula" '+(F.pula?"checked":"")+'>Do puli – dziecko samo zdecyduje, czy weźmie</label>')

   + '<div style="margin-top:16px"><button class="glowny" id="zlec">Zleć zadanie</button></div>';

/* ---------- katalog, zrzut ekranu, poprawki AI ---------- */
let KAT = null, KS = {tryb:"", poziom:null, kat:""}, ZR = null, DP = null;
const POZIOMY = [[6,"6–9 lat"],[10,"10–12 lat"],[13,"13+ lat"]];
const poziomDla = w => !w ? 6 : w < 10 ? 6 : w < 13 ? 10 : 13;
function widokKatalog(d){
  if (!KAT) { fetch("katalog.json").then(r => r.json()).then(j => { KAT = j; zachowajFormularz(); rysuj(); przywrocFormularz(); }); return '<div class="karta mal">Ładuję katalog…</div>'; }
  const pz = KS.poziom || poziomDla(d && d.wiek);
  const lista = KAT.filter(k => k.od === pz);
  const kategorie = [...new Set(lista.map(k => k.kategoria))];
  const kat = kategorie.includes(KS.kat) ? KS.kat : kategorie[0];
  return '<div class="karta" style="margin-top:10px"><div class="mal">Poziom'+(d && d.wiek ? " (" + esc(d.imie) + ": " + d.wiek + " lat)" : "")+'</div><div class="rzad" style="margin:6px 0">'+POZIOMY.map(([v,t]) => '<button data-poziom="'+v+'" class="'+(pz===v?"wyb":"")+'">'+t+'</button>').join("")+'</div>'
    + '<div class="rzad" style="margin-bottom:6px">'+kategorie.map(k => '<button data-kat="'+esc(k)+'" class="'+(k===kat?"wyb":"")+'" style="min-height:38px;flex:0 0 auto">'+esc(k)+'</button>').join("")+'</div>'
    + lista.map((k,i) => [k,i]).filter(([k]) => k.kategoria===kat).map(([k]) => '<button data-kz="'+KAT.indexOf(k)+'" style="width:100%;text-align:left;margin-top:6px;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 12px"><span>'+esc(k.tytul)+'<br><span class="mal" style="font-weight:400">'+WER[k.weryfikacja]+(k.minuty?" "+k.minuty+" min":"")+(k.pora?" · "+PORA[k.pora].toLowerCase():"")+'</span></span><span class="pigu">'+k.punkty+' pkt</span></button>').join("")
    + '</div>';
}
function widokZrzut(){
  let h = '<div class="karta" style="margin-top:10px"><p class="mal" style="margin-top:0">Zrzut ekranu z dziennika (np. zadania domowe, sprawdziany) albo zdjęcie kartki. AI wypisze zadania, Ty wybierzesz, które zlecić.</p>'

function wypelnij(z){

const OTW = new Set();
const det = k => 'data-det="'+k+'" '+(OTW.has(k)?"open":"");
function historia(d){
  const r = (S.punkty||[]).filter(p => p.dziecko_id===d.id);
  if (!r.length) return "";
  return '<details class="karta" '+det("h"+d.id)+'><summary style="min-height:36px;font-weight:600">Historia punktów'+(dziecko()?"":" – "+esc(d.imie))+'</summary>'
    + r.slice(0,30).map(p => '<div class="wiersz" style="min-height:40px;border-top:1px solid var(--linia2)"><span>'+esc(p.powod||"punkty")+'<div class="mal">'+kiedy(p.ts)+'</div></span><b class="'+(p.ile<0?"uw-ic":"ok-ic")+'">'+(p.ile>0?"+":"")+p.ile+'</b></div>').join("") + '</details>';
}
function widokNagrody(){
  let h = '<h1>'+(dziecko()?"Moje nagrody":"Nagrody")+'</h1>';
  for (const d of S.dzieci) {
    const n = S.nagrody.filter(x => x.dziecko_id===d.id && x.stan==="aktywna");
    const wolne = d.saldo - d.zarezerwowane;
    const cel = n.find(x => x.cel), male = n.filter(x => !x.cel);
    if (!dziecko()) h += '<h3>'+esc(d.imie)+'</h3>';
    h += '<div class="karta wiersz"><div><div class="mal">Masz</div><div style="font-size:32px;font-weight:700;color:var(--pom)">'+wolne+' pkt</div>'+(d.zarezerwowane?'<div class="mal">'+d.zarezerwowane+' czeka na zgodę</div>':"")+'</div><div class="mal" style="text-align:right">w tym tygodniu +'+d.tydzien+' pkt'+(d.seria>1?'<br>'+d.seria+' dni z rzędu':"")+'</div></div>';
    if (cel) {
      const proc = Math.min(100, Math.round(100*wolne/cel.koszt));
      const tempo = d.tydzien > 0 ? Math.ceil(Math.max(0, cel.koszt-wolne)/d.tydzien) : null;
      h += '<div class="karta wazna"><div class="mal" style="font-weight:600">Duży cel</div><div class="wiersz" style="margin:6px 0"><b style="font-size:18px">'+esc(cel.nazwa)+'</b><b class="ok-ic">'+wolne+' / '+cel.koszt+'</b></div><div class="pasek"><div style="width:'+proc+'%"></div></div>'
        + (tempo ? '<div class="mal" style="margin-top:6px">Przy tym tempie: około '+tempo+' tyg.</div>' : "")
        + (dziecko() && wolne>=cel.koszt ? '<button class="glowny" style="margin-top:10px" data-wymien="'+cel.id+'">Wymieniam!</button>' : "")
        + (!dziecko() && d.prawa.zleca ? '<button data-usunnagr="'+cel.id+'" style="margin-top:8px">Usuń cel</button>' : "") + '</div>';
    }
    h += '<div class="karta">' + (male.length ? male.map(x => '<div class="wiersz" style="min-height:56px;border-bottom:1px solid var(--linia2)"><span>'+esc(x.nazwa)+'</span>'+(dziecko()?'<button data-wymien="'+x.id+'" '+(wolne<x.koszt?"disabled":"")+'>'+x.koszt+' pkt</button>':'<span class="wiersz"><span class="mal">'+x.koszt+' pkt</span>'+(d.prawa.zleca?'<button data-usunnagr="'+x.id+'" aria-label="Usuń nagrodę" style="min-height:36px">Usuń</button>':"")+'</span>')+'</div>').join("") : '<div class="mal">Jeszcze nie ma nagród.</div>') + '</div>';
    if (dziecko()) h += '<div class="mal">Wymiana punktów czeka na zgodę rodzica.</div>';
    if (dziecko() || d.prawa.zleca) h += '<details class="karta"><summary style="min-height:36px;font-weight:600">'+(dziecko()?"Zaproponuj własną nagrodę":"Dodaj nagrodę")+'</summary><div class="rzad" style="margin-top:8px"><input type="text" id="nn'+d.id+'" placeholder="nazwa" style="flex:3"><input type="number" id="nk'+d.id+'" placeholder="pkt" style="flex:1"></div><label class="krok"><input type="checkbox" id="nc'+d.id+'">Duży cel</label><button class="glowny" data-nowanagr="'+d.id+'">'+(dziecko()?"Wyślij propozycję":"Dodaj")+'</button></details>';
    h += historia(d);
    const hist = S.wymiany.filter(x => x.dziecko_id===d.id && x.stan!=="czeka");
    if (hist.length) h += '<div class="mal">Ostatnio: '+hist.slice(0,3).map(x => esc(x.nazwa)+" ("+(x.stan==="zatwierdzona"?"tak":"nie")+")").join(", ")+'</div>';
  }
  return h;
}

/* ---------- zdarzenia ---------- */
async function zmniejsz(plik, maks){
  const url = URL.createObjectURL(plik);
  try {
    const img = await new Promise((ok, zle) => { const i = new Image(); i.onload = () => ok(i); i.onerror = zle; i.src = url; });
    const sk = Math.min(1, (maks || 1600) / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*sk); c.height = Math.round(img.naturalHeight*sk);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(ok => c.toBlob(ok, "image/jpeg", 0.82));
  } finally { URL.revokeObjectURL(url); }
}
function pokazLink(r, kto){
  const h = '<div class="karta"><b>Link dla: '+esc(kto)+'</b><p class="mal">Otwórz go w domu na telefonie tej osoby: ustawi swój PIN, potem dodaj stronę do ekranu początkowego. Nie wysyłaj linku nikomu innemu.</p><input type="text" readonly value="'+esc(r.link)+'" onclick="this.select()"></div>';
  let e = $("#linkwyn");
  if (!e) { e = document.createElement("div"); e.id = "linkwyn"; $("#app").appendChild(e); }
  e.innerHTML = h; e.scrollIntoView();
}

    if (!e.dataset.pewne) { e.dataset.pewne = 1; e.textContent = "Na pewno skasować PIN? Dotknij jeszcze raz"; return; }
    const o = (S.osoby||S.dzieci).find(x => x.id===+e.dataset.pinreset) || {imie:""};
    try { const r = await akcja("api/osoba/"+e.dataset.pinreset+"/pin_reset", {}, "PIN skasowany"); pokazLink(r, o.imie); } catch(er) {}
  });
  if ($("#wyloguj")) $("#wyloguj").onclick = async ev => { ev.preventDefault(); await api("api/wyloguj", {}); S = null; $("#nav").innerHTML = ""; location.hash = ""; logowanie(); };
  if ($("#pzap")) $("#pzap").onclick = async () => {
    if ($("#pn1").value !== $("#pn2").value) return toast("PIN-y się różnią.");
    try { await akcja("api/pin", {pin:$("#pn1").value, stary:($("#pst")||{}).value||""}, "PIN zapisany"); idz(""); } catch(er) {}
  };
  minutnik();
}
let zapis = {};
function zachowajFormularz(){ ["tyt","opis","kroki","pkt","min","term","godz"].forEach(i => { if ($("#"+i)) zapis[i] = $("#"+i).value; }); }
function przywrocFormularz(){ for (const i in zapis) if ($("#"+i)) $("#"+i).value = zapis[i]; }
function minutnik(){
  const e = $("#minutnik"); if (!e) return;
  const t = () => { if (!document.body.contains(e)) return; const s = Math.max(0, Math.round((+e.dataset.koniec - Date.now())/1000)); e.textContent = s ? Math.floor(s/60)+":"+String(s%60).padStart(2,"0") : "Koniec!"; if (s) setTimeout(t, 1000); };
  t();
}

  const pisze = document.activeElement && ["INPUT","TEXTAREA"].includes(document.activeElement.tagName);
  if (S && !pisze && !czekaOdp && document.visibilityState==="visible" && widok!=="zlec" && widok!=="pin" && S.ja.ma_pin) odswiez();

setInterval(() => { if (S && S.zadania.some(z => z.ocena_stan==="czeka") && !czekaOdp) { const pisze = document.activeElement && ["INPUT","TEXTAREA"].includes(document.activeElement.tagName); if (!pisze) odswiez(); } }, 4000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState==="visible") odswiez(); });
