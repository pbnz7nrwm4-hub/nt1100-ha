<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F6F5F1">
<title>Zadania</title>
<style>
:root{--tlo:#F6F5F1;--karta:#FFFFFF;--tekst:#1C1C1A;--szary:#57564F;--linia:#D6D4CC;--linia2:#ECEAE3;--akcent:#0F766E;--akcent2:#134E4A;--akcentj:#E6F2F0;--pom:#9A3412;--pomj:#FFF1E6;--zle:#B42318}
@media (prefers-color-scheme:dark){:root{--tlo:#161614;--karta:#22221F;--tekst:#F2F1EC;--szary:#B5B3AA;--linia:#45443F;--linia2:#33322E;--akcent:#2BA597;--akcent2:#A7E3DB;--akcentj:#173A36;--pom:#F4A06B;--pomj:#3A2416;--zle:#F97066}}
*{box-sizing:border-box}
body{margin:0;background:var(--tlo);color:var(--tekst);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:26px;margin:4px 0 2px}h2{font-size:20px;margin:0}h3{font-size:13px;font-weight:600;color:var(--szary);margin:18px 0 8px;text-transform:none}
.mal{font-size:13px;color:var(--szary)}
.karta{background:var(--karta);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.karta.wazna{border:2px solid var(--akcent)}
.wiersz{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pigu{border-radius:999px;padding:5px 11px;font-weight:700;font-size:13px;white-space:nowrap;background:var(--pomj);color:var(--pom)}
.pigu.ok{background:var(--akcentj);color:var(--akcent2)}
.pigu.zle{background:transparent;border:1px solid var(--zle);color:var(--zle)}
.pasek{height:10px;border-radius:999px;background:var(--linia2);overflow:hidden}.pasek>div{height:100%;background:var(--akcent);border-radius:999px}
button,.btn{font:inherit;font-weight:600;min-height:46px;border-radius:12px;border:1px solid var(--linia);background:var(--karta);color:var(--tekst);padding:0 14px;cursor:pointer}
button.glowny{background:var(--akcent);border-color:var(--akcent);color:#fff;font-weight:700;width:100%;min-height:52px}
button.wyb{border:2px solid var(--akcent);background:var(--akcentj);color:var(--akcent2)}
button:disabled{opacity:.5}
.rzad{display:flex;gap:8px;flex-wrap:wrap}.rzad>*{flex:1}
.siatka{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.pole{display:block;font-size:13px;font-weight:600;color:var(--szary);margin:12px 0 6px}
input[type=text],input[type=url],input[type=password],input[type=number],input[type=datetime-local],input[type=time],textarea,select{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--linia);background:var(--karta);color:var(--tekst);padding:10px 14px;font:inherit}
textarea{min-height:70px;resize:vertical}
.krok{display:flex;align-items:center;gap:10px;min-height:40px}
.krok input{width:22px;height:22px;accent-color:var(--akcent)}
.zdj{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.zdj img{width:100%;height:160px;object-fit:cover;border-radius:12px;background:var(--linia2)}
.zdj .pusto{height:160px;border-radius:12px;background:var(--linia2);display:flex;align-items:center;justify-content:center;color:var(--szary);font-size:13px;text-align:center;padding:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--karta);border-top:1px solid var(--linia2);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;max-width:140px;text-align:center;padding:10px 4px 12px;color:var(--szary);text-decoration:none;font-size:12px;font-weight:600;min-height:56px}
nav a.akt{color:var(--akcent)}
nav a .lic{background:var(--pom);color:#fff;border-radius:999px;padding:0 6px;font-size:11px;margin-left:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:var(--tekst);color:var(--tlo);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%;z-index:9}
.ok-ic{color:var(--akcent)}.uw-ic{color:var(--pom)}
.wpis{display:flex;gap:10px;align-items:flex-start;margin:6px 0}
.lista>.karta:last-child{margin-bottom:0}
.prawo{display:flex;gap:6px}
.prawo label{display:flex;align-items:center;gap:4px;font-size:13px;min-height:36px}
a{color:var(--akcent)}
.ukryj{display:none}
</style>
</head>
<body>
<main id="app"><p class="mal">Ładuję…</p></main>
<nav id="nav"></nav>
<div id="toast" class="toast ukryj" role="status"></div>
<script>
"use strict";
let S = null, widok = location.hash.slice(1) || "", dzieckoWyb = null, czekaOdp = false;
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const IK = {
  ok:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  uw:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>',
  aparat:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/></svg>',
  gw:'<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M12 2l3 7h7l-5.5 4.5 2 7.5-6.5-4.5-6.5 4.5 2-7.5L2 9h7z"/></svg>'
};
const WER = {zdjecie:"Zdjęcie po", zeszyt:"Zdjęcie zeszytu", minutnik:"Minutnik", zaufanie:"Na zaufanie"};
const PORA = {"":"W ciągu dnia", rano:"Poranek", popoludnie:"Popołudnie", wieczor:"Wieczór"};
const STAN = {do_zrobienia:"do zrobienia", wyslane:"czeka na zatwierdzenie", zatwierdzone:"zatwierdzone", czesciowo:"częściowo", do_poprawki:"do poprawki"};
const WERD = {zrobione:["zrobione","ok"], raczej_zrobione:["raczej zrobione","ok"], niepewne:["niepewne",""], nie_zrobione:["nie widać efektu","zle"]};
const DNI = ["Pn","Wt","Śr","Cz","Pt","So","Nd"];

/* ---------- zdjęcia: nie giną, gdy sieć albo serwer na chwilę zawiedzie ---------- */
let WYBOR = 0;                       // kiedy otwarto aparat/galerię; do tego czasu strona się nie przerysowuje
const wybiera = () => Date.now() - WYBOR < 180000;
let FOTO = [];                       // zdjęcia czekające na wysłanie (kopie w pamięci telefonu)
function fotoBaza(){ return new Promise((ok, zle) => { try { const r = indexedDB.open("zadania", 1); r.onupgradeneeded = () => r.result.createObjectStore("zdjecia", {keyPath:"id", autoIncrement:true}); r.onsuccess = () => ok(r.result); r.onerror = () => zle(r.error); } catch(e) { zle(e); } }); }
async function fotoOp(tryb, f){ const d = await fotoBaza(); return new Promise((ok, zle) => { const t = d.transaction("zdjecia", tryb); const r = f(t.objectStore("zdjecia")); t.oncomplete = () => ok(r && r.result); t.onerror = () => zle(t.error); }); }
async function fotoWczytaj(){ try { FOTO = (await fotoOp("readonly", st => st.getAll())) || []; } catch(e) {} }
async function fotoUsun(id){ FOTO = FOTO.filter(x => x.id !== id); try { await fotoOp("readwrite", st => st.delete(id)); } catch(e) {} }
const czekaj = ms => new Promise(ok => setTimeout(ok, ms));
async function wyslijFoto(sciezka, blob, opis){
  /* Zdjęcie najpierw trafia do pamięci telefonu, potem na serwer (3 próby). Gdy się nie uda, zostaje na liście
     „czeka na wysłanie” i aplikacja ponawia sama – nie trzeba robić zdjęcia drugi raz. */
  const w = {sciezka, blob, opis, osoba: S && S.ja.id, ts: Date.now()};
  try { w.id = await fotoOp("readwrite", st => st.add(w)); } catch(e) { w.id = "m" + w.ts; }
  FOTO.push(w);
  return fotoPonow(w, 3);
}
async function fotoPonow(w, prob){
  if (w.trwa) { const e = new Error("To zdjęcie właśnie się wysyła."); e.czeka = true; throw e; }
  w.trwa = true;
  try { return await fotoProby(w, prob); } finally { w.trwa = false; }
}
async function fotoProby(w, prob){
  let ost;
  for (let i = 0; i < prob; i++) {
    if (i) await czekaj(i * 4000);
    try { const r = await api(w.sciezka, w.blob, "image/jpeg"); await fotoUsun(w.id); return r; }
    catch(e) { ost = e; if (e.kod && e.kod >= 400 && e.kod < 500 && e.kod !== 408 && e.kod !== 429) { await fotoUsun(w.id); throw e; } }
  }
  const er = new Error("Zdjęcie nie wysłało się (" + (ost && ost.kod ? "serwer: " + ost.message : "brak połączenia") + "). Jest zapisane w telefonie – wyślę je sam, gdy połączenie wróci.");
  er.czeka = true; throw er;
}
let FOTO_PONAWIA = false;
async function fotoPonowWszystkie(){
  if (FOTO_PONAWIA || !S) return; FOTO_PONAWIA = true;
  let ok = 0;
  try { for (const w of FOTO.filter(x => x.osoba === S.ja.id)) { try { await fotoPonow(w, 1); ok++; } catch(e) {} } }
  finally { FOTO_PONAWIA = false; }
  if (ok) { toast(ok === 1 ? "Zaległe zdjęcie wysłane" : "Zaległe zdjęcia wysłane: " + ok); await odswiez(); }
}
function fotoKarta(){
  const m = S ? FOTO.filter(x => x.osoba === S.ja.id) : [];
  if (!m.length) return "";
  return '<div class="karta wazna"><b>'+(m.length===1?"Zdjęcie czeka na wysłanie":"Zdjęcia czekają na wysłanie: "+m.length)+'</b><div class="mal">Są zapisane w telefonie. Aplikacja ponawia sama, możesz też wysłać teraz.</div>'
    + m.map(w => '<div class="wiersz" style="margin-top:8px;gap:8px"><span>'+esc(w.opis)+'<div class="mal">'+new Date(w.ts).toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"})+'</div></span><span style="display:flex;gap:6px"><button data-fotousun="'+w.id+'" style="min-height:40px">Usuń</button><button class="wyb" data-fotoponow="'+w.id+'" style="min-height:40px">Wyślij</button></span></div>').join("") + '</div>';
}
function toast(t, dlugo){ const e=$("#toast"); e.textContent=t; e.classList.remove("ukryj"); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.add("ukryj"), dlugo ? 9000 : 3500); }
async function api(sc, dane, typ){
  const o = dane===undefined ? {} : {method:"POST", headers:{"Content-Type": typ||"application/json"}, body: typ ? dane : JSON.stringify(dane)};
  const r = await fetch(sc, o); let j = {};
  try { j = await r.json(); } catch(e) {}
  if (!r.ok) { const er = new Error(j.blad || ("Błąd " + r.status)); er.dane = j; er.kod = r.status; throw er; }
  return j;
}
async function odswiez(){
  try { S = await api("api/stan"); rysuj(); }
  catch(e){
    $("#nav").innerHTML = "";
    if (e.kod===401) { S = null; return logowanie(); }
    $("#app").innerHTML = '<div class="karta">'+esc(e.message)+'</div>';
  }
}
/* ---------- logowanie i PIN ---------- */
let L = {osoby:[], wyb:null, przez_ha:false};
async function logowanie(){
  if (document.activeElement && document.activeElement.id==="lpin") return;
  try { const r = await api("api/logowanie"); L.osoby = r.osoby; L.przez_ha = r.przez_ha; L.konto = r.konto_ha; } catch(e) {}
  const m = location.hash.match(/^#zaloguj-(\d+)$/);
  if (m) L.wyb = +m[1];
  rysujLogowanie();
}
function rysujLogowanie(){
  const o = L.osoby.find(x => x.id===L.wyb);
  let h = '<h1>Zadania</h1><p class="mal">'+(L.przez_ha ? "Konto Home Assistant „"+esc(L.konto)+"” nie jest jeszcze przypisane do nikogo w Zadaniach. Poproś administratora o przypisanie (Osoby → Konto HA) albo wybierz siebie i wpisz swój PIN – wtedy połączy się samo." : "Kim jesteś?")+'</p>';
  h += '<div class="siatka">' + L.osoby.map(x => '<button data-kto="'+x.id+'" class="'+(x.id===L.wyb?"wyb":"")+'">'+esc(x.imie)+'</button>').join("") + '</div>';
  if (o && o.ma_pin) h += '<label class="pole" for="lpin">PIN</label><input type="password" id="lpin" inputmode="numeric" autocomplete="current-password" maxlength="6"><div style="margin-top:12px"><button class="glowny" id="lzal">Wejdź</button></div><p class="mal">Nie pamiętasz PIN-u? Poproś opiekuna albo administratora o skasowanie – potem ustawisz nowy.</p>';
  else if (o) h += '<div class="karta" style="margin-top:12px">'+esc(o.imie)+' nie ma jeszcze PIN-u. Otwórz swój osobisty link (dostaniesz go od administratora) i ustaw PIN.</div>';
  if (!L.osoby.length) h += '<div class="karta">Nie ma jeszcze żadnej osoby. Administratora dodaje instalator.</div>';
  $("#app").innerHTML = h;
  $("#app").querySelectorAll("[data-kto]").forEach(e => e.onclick = () => { L.wyb = +e.dataset.kto; rysujLogowanie(); if ($("#lpin")) $("#lpin").focus(); });
  const wejdz = async () => { try { await api("api/zaloguj", {osoba_id:L.wyb, pin:$("#lpin").value}); if (/^#zaloguj/.test(location.hash)) history.replaceState(null, "", location.pathname); widok = ""; await odswiez(); } catch(e) { toast(e.message); $("#lpin").value = ""; } };
  if ($("#lzal")) { $("#lzal").onclick = wejdz; $("#lpin").onkeydown = ev => { if (ev.key==="Enter") wejdz(); }; }
}
function widokPin(wymuszony){
  const stary = S.ja.ma_pin && !S.ja.przez_ha;
  return '<h1>'+(wymuszony?"Ustaw swój PIN":"Zmień PIN")+'</h1><p class="mal">'+(wymuszony?"Cześć, "+esc(S.ja.imie)+"! Wymyśl PIN (4–6 cyfr). Będziesz nim wchodzić do aplikacji.":"PIN to 4–6 cyfr.")+'</p>'
    + (stary ? '<label class="pole" for="pst">Obecny PIN</label><input type="password" id="pst" inputmode="numeric" maxlength="6">' : "")
    + '<label class="pole" for="pn1">Nowy PIN</label><input type="password" id="pn1" inputmode="numeric" autocomplete="new-password" maxlength="6">'
    + '<label class="pole" for="pn2">Powtórz PIN</label><input type="password" id="pn2" inputmode="numeric" autocomplete="new-password" maxlength="6">'
    + '<div style="margin-top:14px"><button class="glowny" id="pzap">Zapisz PIN</button></div>'
    + (wymuszony ? "" : '<div style="margin-top:8px"><a href="#">Wróć</a></div>');
}
function stopka(){
  return '<p class="mal" style="text-align:center;margin-top:28px">'+esc(S.ja.imie)+(S.ja.admin?' · <a href="#ustawienia">Ustawienia</a>':"")+' · <a href="#pin">Zmień PIN</a> · <a href="#" id="wyloguj">'+(S.ja.przez_ha?"Odłącz to konto":"Wyloguj")+'</a> · wersja '+esc(S.wersja)+'</p>';
}
async function akcja(sc, dane, msg, typ){
  if (czekaOdp) return; czekaOdp = true;
  try { const r = await api(sc, dane, typ); if (msg) toast(msg); await odswiez(); return r; }
  catch(e){ toast(e.message); throw e; }
  finally { czekaOdp = false; }
}
function idz(w){ location.hash = w; }
window.addEventListener("hashchange", () => { widok = location.hash.slice(1); rysuj(); scrollTo(0,0); });

const dziecko = () => S.ja.rola === "dziecko";
const dz = id => S.dzieci.find(d => d.id === id) || {imie:"?"};
const czas = s => s ? s.slice(11,16) : "";
function kiedy(s){
  if (!s) return "";
  const d = s.slice(0,10), dzis = S.dzis;
  const jutro = new Date(Date.parse(dzis+"T12:00:00")+864e5).toISOString().slice(0,10);
  return (d===dzis ? "dziś" : d===jutro ? "jutro" : d.slice(8,10)+"."+d.slice(5,7)) + " " + czas(s);
}
function zostalo(s){
  if (!s) return "";
  const m = Math.round((Date.parse(s) - Date.parse(S.teraz)) / 60000);
  if (m < 0) return "po terminie";
  if (m < 60) return "jeszcze " + m + " min";
  const h = Math.floor(m/60);
  return h < 24 ? "jeszcze " + h + " h " + (m%60) + " min" : "do " + kiedy(s);
}
const doZatw = () => S.zadania.filter(z => (z.stan==="wyslane" || z.prosba) && dz(z.dziecko_id).prawa?.zatwierdza).length
  + S.wymiany.filter(w => w.stan==="czeka" && dz(w.dziecko_id).prawa?.zatwierdza).length
  + S.nagrody.filter(n => n.stan==="propozycja" && dz(n.dziecko_id).prawa?.zatwierdza).length;

function rysujNav(){
  let p;
  if (dziecko()) p = [["","Dziś"],["nauka","Nauka"],["pula","Pula"],["nagrody","Nagrody"]];
  else { p = [["","Zatwierdź"],["zlec","Zleć"],["dzieci","Dzieci"],["nagrody","Nagrody"]]; if (S.ja.admin) p.push(["osoby","Osoby"]); }
  const n = dziecko() ? 0 : doZatw();
  $("#nav").innerHTML = p.map(([h,t]) => '<a href="#'+h+'" class="'+((widok===h || (h==="" && /^z\d/.test(widok)) || (h==="nauka" && /^n\d/.test(widok)))?"akt":"")+'">'+t+(h==="" && n ? ' <span class="lic">'+n+'</span>' : "")+'</a>').join("");
}

function rysuj(){
  if (!S) return;
  if (!S.ja.ma_pin) { $("#nav").innerHTML = ""; $("#app").innerHTML = widokPin(true); return podepnij(); }
  rysujNav();
  const m = widok.match(/^z(\d+)$/);
  let h;
  if (widok==="pin") h = widokPin(false);
  else if (m) h = widokZadania(+m[1]);
  else if (dziecko() && /^n\d+$/.test(widok)) h = widokSesja(+widok.slice(1));
  else if (dziecko() && widok==="nauka") h = widokNauka();
  else if (dziecko()) h = widok==="pula" ? widokPula() : widok==="nagrody" ? widokNagrody() : widokDzis();
  else h = widok==="zlec" ? widokZlec() : widok==="dzieci" ? widokDzieci() : widok==="nagrody" ? widokNagrody() : widok==="osoby" && S.ja.admin ? widokOsoby() : widok==="ustawienia" && S.ja.admin ? widokUstawienia() : widokZatwierdz();
  if (S.ja.podglad) h = '<div class="karta wazna" style="position:sticky;top:6px;z-index:5"><b>Oglądasz jako '+esc(S.ja.imie)+'</b><div class="mal">Wszystko, co tu klikniesz, zapisuje się naprawdę.</div><button id="podkoniec" style="width:100%;margin-top:8px">Wróć do siebie</button></div>' + h;
  $("#app").innerHTML = fotoKarta() + h + (widok==="pin" ? "" : stopka());
  podepnij();
}

/* ---------- dziecko ---------- */
function widokDzis(){
  const ja = S.dzieci[0] || {saldo:0, seria:0};
  const moje = S.zadania.filter(z => !z.pula);
  const dzis = moje.filter(z => z.dzien === S.dzis || ["do_zrobienia","do_poprawki"].includes(z.stan));
  const d = new Date(Date.parse(S.dzis+"T12:00:00"));
  let h = '<div class="wiersz"><div><div class="mal">'+d.toLocaleDateString("pl-PL",{weekday:"long", day:"numeric", month:"long"})+'</div><h1>Cześć, '+esc(S.ja.imie)+'</h1></div><span class="pigu">'+IK.gw+' '+(ja.saldo-ja.zarezerwowane)+' pkt</span></div>';
  for (const pora of ["rano","popoludnie","wieczor"]) {
    const r = dzis.filter(z => z.pora===pora && z.dzien===S.dzis);
    if (!r.length) continue;
    const zr = r.filter(z => z.stan!=="do_zrobienia" && z.stan!=="do_poprawki").length;
    h += '<div class="karta" style="margin-top:12px"><div class="wiersz"><b>'+PORA[pora]+'</b><b class="ok-ic">'+zr+' z '+r.length+'</b></div><div class="pasek" style="margin:10px 0"><div style="width:'+Math.round(100*zr/r.length)+'%"></div></div>'
      + r.map(z => '<div class="wiersz" style="min-height:40px"><a href="#z'+z.id+'">'+esc(z.tytul)+'</a><span class="mal">'+(z.stan==="do_zrobienia"?"":STAN[z.stan])+'</span></div>').join("")
      + (ja.seria ? '<div class="mal">Seria: '+ja.seria+' dni z rzędu.</div>' : "") + '</div>';
  }
  const reszta = dzis.filter(z => !z.pora || z.dzien!==S.dzis);
  h += '<h3>Na dziś</h3>';
  if (!reszta.length) h += '<div class="karta mal">Nic więcej na dziś. Możesz wziąć coś z puli.</div>';
  h += '<div class="lista">' + reszta.map((z,i) => kartaDziecka(z, i===0 && ["do_zrobienia","do_poprawki"].includes(z.stan))).join("") + '</div>';
  const jutro = new Date(Date.parse(S.dzis+"T12:00:00") + 86400000).toISOString().slice(0,10) + "T07:00";
  h += '<h3>Moje przypomnienia</h3><div class="karta">' + (przypomnieniaLista(S.ja.id, true) || '<div class="mal">Nic nie masz zapisane. Dodaj np. kartkówkę albo strój na WF.</div>')
    + '<details '+det("nprz")+' style="margin-top:8px"><summary style="min-height:36px;font-weight:600">Dodaj przypomnienie</summary><label class="pole" for="przt">O czym przypomnieć</label><input type="text" id="przt" maxlength="160" placeholder="np. Kartkówka z matematyki"><label class="pole" for="przk">Kiedy</label><input type="datetime-local" id="przk" value="'+jutro+'"><button class="glowny" id="przdodaj" style="margin-top:10px">Zapisz przypomnienie</button></details></div>';
  h += '<details class="karta" '+det("ekstra")+'><summary style="min-height:36px;font-weight:600">Zrobiłam / zrobiłem coś ekstra</summary><div class="mal">Coś, o co nikt nie prosił. Rodzic zobaczy i przyzna punkty.</div><label class="pole" for="ekst">Co to było</label><input type="text" id="ekst" maxlength="120" placeholder="np. Umyłam okno w pokoju"><button class="glowny" id="eksdodaj" style="margin-top:10px">Wyślij do rodzica</button></details>';
  return h;
}
function kartaDziecka(z, rozwin){
  const otw = ["do_zrobienia","do_poprawki"].includes(z.stan);
  let h = '<div class="karta '+(rozwin?"wazna":"")+'"><div class="wiersz" style="align-items:flex-start"><div><a href="#z'+z.id+'" style="font-size:18px;font-weight:700;color:inherit;text-decoration:none">'+esc(z.tytul)+'</a><div class="mal">'+(z.wlasne ? "z własnej inicjatywy"+(z.przyznane?" · +"+z.przyznane+" pkt":"") : (z.zleca?"od: "+esc(z.zleca)+" · ":"")+z.punkty+' pkt · '+WER[z.weryfikacja].toLowerCase())+'</div></div>'
    + (otw ? '<span class="pigu '+(z.po_terminie?"zle":"")+'">'+zostalo(z.termin)+'</span>' : '<span class="pigu ok">'+STAN[z.stan]+'</span>') + '</div>';
  if (z.stan==="do_poprawki" && z.slowo) h += '<div class="wpis uw-ic">'+IK.uw+'<span style="color:var(--tekst)">'+esc(z.slowo)+'</span></div>';
  if (rozwin) h += kroki(z) + '<div style="margin-top:10px"><a class="btn glowny" style="display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;background:var(--akcent);color:#fff;border-radius:12px;min-height:50px" href="#z'+z.id+'">'+(z.weryfikacja==="minutnik"?"Otwórz minutnik":z.weryfikacja==="zaufanie"?"Zrobione":IK.aparat+" Zrobione – zrób zdjęcie")+'</a></div>';
  if ((z.stan==="zatwierdzone"||z.stan==="czesciowo") && z.slowo) h += '<div class="mal" style="margin-top:6px">'+esc(z.zatwierdzil)+': „'+esc(z.slowo)+'”</div>';
  return h + '</div>';
}
function kroki(z, tylkoOdczyt){
  if (!z.kroki.length) return "";
  return '<div style="margin-top:8px">' + z.kroki.map((k,i) => '<label class="krok"><input type="checkbox" data-krok="'+z.id+':'+i+'" '+(k.z?"checked":"")+' '+(tylkoOdczyt?"disabled":"")+'>'+esc(k.t)+'</label>').join("") + '</div>';
}
function widokPula(){
  const p = S.zadania.filter(z => z.pula);
  return '<h1>Pula zadań</h1><p class="mal">Weź coś dodatkowo – za punkty.</p>' + (p.length ? p.map(z => '<div class="karta"><div class="wiersz"><div><b>'+esc(z.tytul)+'</b><div class="mal">'+z.punkty+' pkt · '+WER[z.weryfikacja].toLowerCase()+'</div>'+(z.opis?'<div class="mal">'+esc(z.opis)+'</div>':"")+'</div><button data-wez="'+z.id+'">Biorę</button></div></div>').join("") : '<div class="karta mal">Pula jest pusta.</div>');
}

/* ---------- jedno zadanie ---------- */
let POMOC_CZEKA = 0;
function widokZadania(id){
  const z = S.zadania.find(x => x.id === id);

    if (ja && otw) h += '<div class="rzad"><label class="btn" style="display:flex;align-items:center;justify-content:center">Przed<input type="file" accept="image/*" capture="environment" data-foto="'+z.id+':przed" class="ukryj"></label><label class="btn" style="display:flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--akcent)">'+IK.aparat+' Po<input type="file" accept="image/*" capture="environment" data-foto="'+z.id+':po" class="ukryj"></label>'+(pokPo?'<button data-usunfoto="'+pokPo.id+'">Usuń ostatnie</button>':"")+'</div>';
  }
  // pomoc na start (dziecko prosi samo; rodzic widzi, że prosiło)
  if (z.pomoc) h += '<div class="karta"><div class="mal" style="font-weight:600">'+(ja?"Od czego zacząć":"Dziecko poprosiło o podpowiedź ("+z.pomoc.ile+"×)")+'</div><div style="margin:6px 0"><b>'+esc(z.pomoc.pierwszy_krok)+'</b></div>'
    + z.pomoc.wskazowki.map(w => '<div class="wpis">'+IK.ok+'<span>'+esc(w)+'</span></div>').join("")
    + (z.pomoc.minuty ? '<div class="mal">Całość zajmie około '+z.pomoc.minuty+' min.</div>' : "") + (ja && z.pomoc.otucha ? '<div class="mal">'+esc(z.pomoc.otucha)+'</div>' : "") + '</div>';
  if (ja && otw && S.ai && !z.pula && (!z.pomoc || z.pomoc.ile < 3)) h += '<button data-pomoc="'+z.id+'" style="width:100%;margin-top:8px">'+(POMOC_CZEKA===z.id ? "Komputer w domu myśli…" : z.pomoc ? "Podpowiedz inaczej" : "Pomóż mi zacząć")+'</button>';
  if (!ja && z.proby > 1) h += '<div class="karta mal">Zdjęcie „po” robione '+z.proby+' razy – dziecko poprawiało przed wysłaniem.</div>';
  // ocena AI
  if (z.ocena_stan==="czeka") h += '<div class="karta mal">Komputer w domu ogląda zdjęcie…</div>';
  else if (z.ocena && z.ocena.werdykt) {
    const w = WERD[z.ocena.werdykt] || [z.ocena.werdykt,""];
    h += '<div class="karta"><div class="wiersz"><span class="mal" style="font-weight:600">'+(ja?"Szybkie sprawdzenie":"Ocena AI (komputer w domu)")+'</span><span class="pigu '+w[1]+'">'+w[0]+'</span></div>'
      + z.ocena.punkty.map(p => '<div class="wpis '+(p.ok?"ok-ic":"uw-ic")+'">'+(p.ok?IK.ok:IK.uw)+'<span style="color:var(--tekst)">'+esc(p.tekst)+'</span></div>').join("")
      + (ja && z.ocena.dla_dziecka ? '<div class="mal">'+esc(z.ocena.dla_dziecka)+'</div>' : "")
      + (ja ? '<div class="mal">Możesz poprawić i zrobić zdjęcie jeszcze raz albo wysłać tak.</div>' : '<div class="mal">AI tylko podpowiada. Decyzja należy do Ciebie.</div>') + '</div>';
  } else if (z.ocena_stan==="blad" && !ja) h += '<div class="karta mal">Ocena AI się nie udała – oceń sam.</div>';
  if (z.komentarz) h += '<div class="karta"><div class="mal">'+(ja?"Twój komentarz":"Komentarz: "+esc(d.imie))+'</div>„'+esc(z.komentarz)+'”</div>';
  // akcje dziecka
  if (ja && otw) {
    if (z.weryfikacja==="minutnik" && z.minuty) {

      + '<div class="mal" style="text-align:center;margin:12px 0 8px">Zdjęcie zostaje w domu. Decyduje rodzic.</div><button class="glowny" data-wyslij="'+z.id+'">Wyślij</button>';
  }
  if (ja && otw && !z.pula) h += z.prosba ? '<div class="karta mal" style="margin-top:12px">Prośba o przesunięcie wysłana („'+esc(z.prosba)+'”). Czekasz na odpowiedź rodzica.</div>'
    : '<details class="karta" '+det("ndr"+z.id)+' style="margin-top:12px"><summary style="min-height:36px;font-weight:600">Dziś nie dam rady</summary><div class="mal">Napisz dlaczego. Rodzic zdecyduje, czy przesunąć na jutro.</div><input type="text" id="ndrp" maxlength="200" placeholder="np. Mam trening do 20:00" style="margin-top:8px"><button data-ndr="'+z.id+'" style="width:100%;margin-top:8px">Poproś o przesunięcie</button></details>';
  if (!ja && z.prosba) h += '<div class="karta wazna"><div class="mal" style="font-weight:600">'+esc(d.imie)+' prosi o przesunięcie</div><div style="margin:6px 0">„'+esc(z.prosba)+'”</div>'+(d.prawa?.zatwierdza?'<div class="rzad"><button data-prosba="'+z.id+':zostaje">Zostaje na dziś</button><button class="wyb" data-prosba="'+z.id+':jutro">Przesuń na jutro</button></div>':"")+'</div>';
  if (z.pula && ja) h += '<button class="glowny" data-wez="'+z.id+'">Biorę to zadanie</button>';
  // akcje rodzica
  if (!ja && z.stan==="wyslane" && d.prawa?.zatwierdza) {
    h += '<label class="pole" for="slowo">Słowo do dziecka (zobaczy je przy zadaniu)</label><input type="text" id="slowo" maxlength="300" placeholder="np. Super, dziękuję!">'
      + (z.wlasne ? '<label class="pole" for="pktwl">Ile punktów za to przyznać</label><input type="number" id="pktwl" min="0" max="1000" value="5"><div style="margin-top:12px"><button class="glowny" data-dec="'+z.id+':zatwierdz">Przyznaj punkty</button></div><div style="margin-top:8px"><button data-dec="'+z.id+':poprawka" style="width:100%">Nie tym razem</button></div>'
        : '<div style="margin-top:12px"><button class="glowny" data-dec="'+z.id+':zatwierdz">Zatwierdź · +'+z.punkty+' pkt</button></div>'
      + '<div class="rzad" style="margin-top:8px"><button data-dec="'+z.id+':poprawka">Do poprawki</button><button data-dec="'+z.id+':czesciowo">Częściowo · +'+Math.floor(z.punkty/2)+'</button></div>');
  }
  if (!ja && d.prawa?.zleca && !["zatwierdzone","czesciowo"].includes(z.stan)) h += '<div style="margin-top:20px"><button data-usunzad="'+z.id+'" style="width:100%;color:var(--zle)">Usuń zadanie</button></div>';

/* ---------- nauka z AI ---------- */
const TRYB = {przepytaj:["Przepytaj mnie","5 pytań po kolei, od razu wiesz, czy dobrze"], test:["Test przed sprawdzianem","10 pytań, wynik na końcu"], wytlumacz:["Wytłumacz mi","Ty pytasz o to, czego nie rozumiesz"]};
const OCENA = {dobrze:["dobrze","ok"], czesciowo:["prawie",""], zle:["jeszcze nie","zle"]};
const POZA = "To nie wynika z Twoich materiałów – sprawdź w podręczniku albo zapytaj nauczyciela.";
let NS = {tryb:"przepytaj", czeka:""};
function naukaWynik(n){ return n.tryb==="wytlumacz" ? "pytań: "+n.pytan_dziecka : n.ile ? n.dobrze+" z "+n.ile+(n.odpowiedzi<n.ile?" (w trakcie)":"") : "nie zaczęte"; }
function widokNauka(){
  if (!S.ai) return '<h1>Nauka</h1><div class="karta mal">Komputer w domu, który pomaga w nauce, nie jest jeszcze podłączony. Powiedz rodzicowi.</div>';
  let h = '<h1>Uczę się</h1><div class="karta"><label class="pole" for="ntemat" style="margin-top:0">Czego się uczysz?</label><input type="text" id="ntemat" maxlength="120" placeholder="np. Ułamki zwykłe, Powstanie styczniowe">'
    + '<label class="pole">Jak chcesz się uczyć?</label>' + Object.keys(TRYB).map(k => '<button data-ntryb="'+k+'" class="'+(NS.tryb===k?"wyb":"")+'" style="width:100%;margin-bottom:8px;text-align:left;padding:10px 14px;height:auto"><b>'+TRYB[k][0]+'</b><div class="mal">'+TRYB[k][1]+'</div></button>').join("")
    + '<button class="glowny" id="nstart" style="margin-top:6px">Dalej – dodam materiały</button></div>';
  const r = S.nauka || [];
  if (r.length) h += '<h3>Ostatnio</h3>' + r.slice(0,8).map(n => '<a href="#n'+n.id+'" class="karta" style="display:block;color:inherit;text-decoration:none"><div class="wiersz"><b>'+esc(n.temat)+'</b><span class="mal">'+naukaWynik(n)+'</span></div><div class="mal">'+TRYB[n.tryb][0]+' · '+kiedy(n.start)+(n.minuty?' · '+n.minuty+' min':"")+'</div></a>').join("");
  return h;
}
function widokSesja(id){
  const n = (S.nauka||[]).find(x => x.id===id);
  if (!n) return '<h1>Nauka</h1><div class="karta mal">Nie ma takiej nauki.</div>';
  const cz = t => NS.czeka===t;
  let h = '<div class="wiersz" style="justify-content:flex-start;gap:12px"><a class="btn" href="#nauka" aria-label="Wróć" style="display:flex;align-items:center;justify-content:center;min-width:46px;min-height:46px;border:1px solid var(--linia);border-radius:12px;text-decoration:none;color:inherit">←</a><div><h2>'+esc(n.temat)+'</h2><div class="mal">'+TRYB[n.tryb][0]+(n.minuty?' · '+n.minuty+' min':"")+'</div></div></div>';
  const mozeMat = !n.ile && n.strony < 3 && !n.koniec;
  h += '<div class="karta" style="margin-top:12px"><div class="wiersz"><b>Materiały</b><span class="mal">'+(n.strony ? n.strony+" z 3 stron" : n.ma_material ? "notatki wpisane" : "brak")+'</span></div>'
    + (n.ma_material ? "" : '<div class="mal" style="margin-top:6px">Zrób zdjęcie notatek albo strony z podręcznika. Bez materiału komputer pyta z własnej wiedzy i może nie trafić w to, co było na lekcji.</div>')
    + (mozeMat ? '<label class="btn" style="display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;min-height:46px;border:2px solid var(--akcent);border-radius:12px">'+IK.aparat+' '+(cz("strona")?"Komputer czyta stronę…":n.strony?"Dodaj kolejną stronę":"Zrób zdjęcie strony")+'<input type="file" accept="image/*" capture="environment" data-nstrona="'+n.id+'" class="ukryj"></label>' : "") + '</div>';
  if (n.tryb==="wytlumacz") {
    h += (n.rozmowa||[]).map(r => '<div class="karta"><div class="mal" style="font-weight:600">Pytasz</div><div>'+esc(r.p)+'</div><div class="mal" style="font-weight:600;margin-top:8px">Odpowiedź</div><div>'+esc(r.o)+'</div>'+(r.poza?'<div class="wpis uw-ic" style="margin-top:8px">'+IK.uw+'<span style="color:var(--tekst)"><b>Uwaga:</b> '+POZA+'</span></div>':"")+'</div>').join("");
    if (!n.koniec) h += '<label class="pole" for="npyt">Czego nie rozumiesz?</label><textarea id="npyt" maxlength="400" placeholder="np. Jak sprowadzić ułamki do wspólnego mianownika?"></textarea><button class="glowny" data-npytaj="'+n.id+'" style="margin-top:10px">'+(cz("pytanie")?"Komputer w domu myśli…":"Zapytaj")+'</button><button data-nkoniec="'+n.id+'" style="width:100%;margin-top:8px">Kończę naukę</button>';
    else h += '<div class="karta mal">Nauka zakończona. Zadanych pytań: '+n.pytan_dziecka+'.</div>';
    return h;
  }
  if (!n.ile) return h + '<button class="glowny" data-nuloz="'+n.id+'" style="margin-top:12px">'+(cz("pytania")?"Komputer układa pytania…":"Ułóż pytania")+'</button>';
  const test = n.tryb==="test", koniec = n.odpowiedzi >= n.ile;
  if (koniec) h += '<div class="karta wazna" style="text-align:center"><div class="mal">Wynik</div><div style="font-size:36px;font-weight:700">'+n.dobrze+' z '+n.ile+'</div>'+(n.czesciowo?'<div class="mal">i '+n.czesciowo+' prawie dobrze</div>':"")+'<div class="mal" style="margin-top:6px">'+(n.dobrze===n.ile?"Komplet. Świetna robota.":"Przeczytaj jeszcze raz to, co poszło gorzej, i spróbuj jutro.")+'</div></div>';
  n.pytania.forEach((p, i) => {
    const pierwsze = n.pytania.findIndex(x => !x.ocena) === i;
    if (!p.ocena && !pierwsze) return;
    h += '<div class="karta '+(pierwsze?"wazna":"")+'"><div class="wiersz" style="align-items:flex-start"><b>'+(i+1)+'. '+esc(p.p)+'</b>'+(p.ocena && (!test || koniec) ? '<span class="pigu '+OCENA[p.ocena][1]+'">'+OCENA[p.ocena][0]+'</span>' : "")+'</div>'
      + (p.poza ? '<div class="mal" style="margin-top:4px">pytanie spoza Twoich materiałów</div>' : "");
    if (p.ocena) h += '<div class="mal" style="margin-top:8px">Twoja odpowiedź</div><div>'+esc(p.moja)+'</div>' + (!test || koniec ? '<div class="mal" style="margin-top:8px">'+esc(p.komentarz)+'</div><div class="mal" style="margin-top:6px">Wzorcowa odpowiedź: '+esc(p.wzor)+'</div>' : '<div class="mal" style="margin-top:6px">Zapisane. Wynik zobaczysz na końcu.</div>');
    else h += '<textarea id="nodp" maxlength="600" placeholder="Napisz swoimi słowami. Jeśli nie wiesz, napisz „nie wiem”." style="margin-top:10px"></textarea><button class="glowny" data-nodp="'+n.id+':'+i+'" style="margin-top:10px">'+(cz("odp")?"Komputer sprawdza…":test?"Dalej":"Sprawdź")+'</button>';
    h += '</div>';
  });
  if (koniec && n.poza) h += '<div class="karta mal">'+IK.uw+' Część pytań była spoza Twoich materiałów. '+POZA+'</div>';
  if (koniec) h += '<a class="btn" href="#nauka" style="display:flex;align-items:center;justify-content:center;min-height:46px;border:1px solid var(--linia);border-radius:12px;text-decoration:none;color:inherit">Nowa nauka</a>';
  return h;
}

/* ---------- rodzic ---------- */
function widokZatwierdz(){
  const z = S.zadania.filter(x => x.stan==="wyslane" && dz(x.dziecko_id).prawa?.zatwierdza);
  const w = S.wymiany.filter(x => x.stan==="czeka" && dz(x.dziecko_id).prawa?.zatwierdza);
  const n = S.nagrody.filter(x => x.stan==="propozycja" && dz(x.dziecko_id).prawa?.zatwierdza);
  let h = '<h1>Do zatwierdzenia</h1><p class="mal">Cześć, '+esc(S.ja.imie)+'.</p>' + pierwszeKroki();
  if (!z.length && !w.length && !n.length && !S.zadania.some(x => x.prosba && dz(x.dziecko_id).prawa?.zatwierdza)) h += '<div class="karta mal">Nic nie czeka. Tu pojawi się zadanie, gdy dziecko je wyśle.</div>';
  h += z.map(x => {

async function zmniejsz(plik, maks){
  const url = URL.createObjectURL(plik);
  try {
    const img = await new Promise((ok, zle) => { const i = new Image(); i.onload = () => ok(i); i.onerror = zle; i.src = url; });
    const sk = Math.min(1, (maks || 1600) / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*sk); c.height = Math.round(img.naturalHeight*sk);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(ok => c.toBlob(ok, "image/jpeg", 0.82));
  } finally { URL.revokeObjectURL(url); }
}

let zapis = {};
function zachowajFormularz(){ ["tyt","opis","kroki","pkt","min","term","godz"].forEach(i => { if ($("#"+i)) zapis[i] = $("#"+i).value; }); }
function przywrocFormularz(){ for (const i in zapis) if ($("#"+i)) $("#"+i).value = zapis[i]; }
function minutnik(){
  const e = $("#minutnik"); if (!e) return;
  const t = () => { if (!document.body.contains(e)) return; const s = Math.max(0, Math.round((+e.dataset.koniec - Date.now())/1000)); e.textContent = s ? Math.floor(s/60)+":"+String(s%60).padStart(2,"0") : "Koniec!"; if (s) setTimeout(t, 1000); };
  t();
}
