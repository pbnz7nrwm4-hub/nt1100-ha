<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pojazdy</title>
<style>
:root{--bg:#0b1220;--card:#121b2d;--card2:#18233a;--ink:#e8edf6;--mut:#8b98ae;--line:#24324d;--acc:#3d8bfd;--acc2:#f76707;--ev:#20c997;--ok:#40c057;--warn:#fab005;--bad:#fa5252;--sheet:#0f1728;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#eef1f6;--card:#fff;--card2:#f4f6fa;--ink:#141a26;--mut:#5d6b80;--line:#dde3ec;--acc:#1c6ef2;--ev:#0ca678;--sheet:#fff;color-scheme:light}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.top h1{font-size:18px;margin:0;flex:1}
main{max-width:640px;margin:0 auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.mut{color:var(--mut)}.sm{font-size:12px}.xs{font-size:11px}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.big{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.fuel{color:var(--acc2)}.ev{color:var(--ev)}.acc{color:var(--acc)}.bad{color:var(--bad)}
.ico{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--card2);flex:none}
.ico svg{width:21px;height:21px}
.vname{font-weight:700;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.stat{background:var(--card2);border-radius:8px;padding:7px 8px;min-width:0}
.stat .v{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.stat .l{font-size:10px;color:var(--mut);letter-spacing:.03em}
.split{display:flex;height:9px;border-radius:999px;overflow:hidden;background:var(--card2);margin-top:6px}
.leg{display:flex;gap:10px;font-size:11px;color:var(--mut);flex-wrap:wrap;margin-top:4px}
.leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.chip{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--card2);color:var(--mut);white-space:nowrap}
.chip.auto{background:color-mix(in srgb,var(--ev) 18%,transparent);color:var(--ev)}
.chip.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.chip.ok{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.dot.sh{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);font-size:11px}
.rata{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.rata:last-child{border-bottom:0}
.ck{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);background:none;display:grid;place-items:center;flex:none;font-weight:900;cursor:pointer;color:var(--bg)}
.ck.on{background:var(--ok);border-color:var(--ok)}
.rr{display:grid;grid-template-columns:1.3fr 1fr auto;gap:6px;align-items:end}
.rr .f input{padding:9px 8px;font-size:15px}
.pchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.banner{border-color:color-mix(in srgb,var(--warn) 50%,var(--line));cursor:pointer}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--acc2);color:#fff;border:0;border-radius:999px;padding:13px 20px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.35);cursor:pointer;z-index:6}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav.tabs button{flex:1;background:none;border:0;padding:10px 0 12px;font-size:11px;color:var(--mut);cursor:pointer}
nav.tabs button.on{color:var(--acc);font-weight:700}
nav.tabs svg{display:block;margin:0 auto 2px;width:20px;height:20px}
.seg{display:flex;background:var(--card2);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;background:none;border:1px solid transparent;padding:6px 0;border-radius:7px;color:var(--mut);font-size:12px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;border-color:var(--line)}
select.pick{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px}
.list{display:flex;flex-direction:column}
.it{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start;cursor:pointer}
.it:last-child{border-bottom:0}
.dot{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:13px;font-weight:800}
.dot.f{background:color-mix(in srgb,var(--acc2) 20%,transparent);color:var(--acc2)}
.dot.e{background:color-mix(in srgb,var(--ev) 20%,transparent);color:var(--ev)}
.dot.c{background:color-mix(in srgb,var(--acc) 20%,transparent);color:var(--acc)}
.dot.x{background:var(--card2);color:var(--mut)}
.it .t{font-weight:700}
.it .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.sub{margin-left:14px;border-left:2px solid var(--line);padding-left:8px}
.mon{font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;padding-top:8px}
.prog{height:6px;border-radius:999px;background:var(--card2);overflow:hidden;margin-top:6px}
.prog b{display:block;height:100%;border-radius:999px}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{fill:var(--mut);font-size:9px}
.kv{display:flex;gap:8px;padding:3px 0;font-size:13px}.kv span:first-child{color:var(--mut);flex:1}
.kv span:last-child{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.empty{color:var(--mut);text-align:center;padding:24px 8px;line-height:1.6}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px;font-weight:800;cursor:pointer;width:100%}
.btn.sec{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.del{background:var(--card2);color:var(--bad);border:1px solid var(--line)}
.btns{display:flex;gap:8px}
/* arkusz (formularz) */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:0 0 calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .hd{position:sticky;top:0;background:var(--sheet);display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);z-index:1}
.sheet .hd h2{font-size:17px;margin:0;flex:1}
.sheet .hd button{background:none;border:0;font-size:15px;cursor:pointer}
.sheet .hd .save{color:var(--acc);font-weight:800}
.sheet .bd{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12px;color:var(--mut)}
.f input,.f select,.f textarea{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:11px 10px;font-size:16px;width:100%}
.f input.hint{border-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tog{display:flex;align-items:center;gap:10px;padding:4px 2px;cursor:pointer}
.tog input{width:20px;height:20px}
.note{font-size:12px;color:var(--mut);line-height:1.45}
.warnbox{background:color-mix(in srgb,var(--warn) 15%,transparent);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);border-radius:9px;padding:8px 10px;font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-weight:700;z-index:30;font-size:13px;max-width:90vw}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div class="top"><h1 id="tytul">Pojazdy</h1><span id="topx"></span></div>
<main id="main"><div class="empty">Ładuję…</div></main>
<button class="fab" id="fab" type="button">+ Tankowanie</button>
<nav class="tabs" id="tabs"></nav>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf=(v,d=1)=>v==null||v===""||isNaN(v)?"–":Number(v).toLocaleString("pl-PL",{minimumFractionDigits:d,maximumFractionDigits:d});
const zakres=s=>s.kwh100==null?nf(null):(s.kwh100_od!=null&&s.kwh100_do!=null&&s.kwh100_do-s.kwh100_od>=0.5?nf(s.kwh100_od,0)+"–"+nf(s.kwh100_do,0):nf(s.kwh100));
const zl=(v,d=0)=>v==null?"–":nf(v,d)+" zł";
const MIES=["sty","lut","mar","kwi","maj","cze","lip","sie","wrz","paź","lis","gru"];
const MIESD=["Styczeń","Luty","Marzec","Kwiecień","Maj","Czerwiec","Lipiec","Sierpień","Wrzesień","Październik","Listopad","Grudzień"];
const dzien=s=>{if(!s)return"";const d=s.slice(0,10).split("-");return (+d[2])+"."+d[1]+(d[0]!==String(new Date().getFullYear())?"."+d[0]:"")};
const godz=s=>s&&s.length>=16?s.slice(11,16):"";
async function api(p,opt){const r=await fetch("api/"+p,opt);const j=await r.json().catch(()=>({blad:"błąd serwera"}));if(!r.ok)throw new Error(j.blad||("błąd "+r.status));return j}
const post=(p,b)=>api(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
const ICO={
 auto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13l2-5h14l2 5v5H3z"/><circle cx="7" cy="17" r="1.6" fill="currentColor"/><circle cx="17" cy="17" r="1.6" fill="currentColor"/></svg>',
 moto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5.5" cy="16" r="3"/><circle cx="18.5" cy="16" r="3"/><path d="M5.5 16l4-6h5l4 6M12 10l-2-4h-2"/></svg>',
 start:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9H3z"/></svg>',
 hist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
 stat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>',
 term:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
 wiecej:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>'};
const TABS=[["start","Start"],["historia","Historia"],["statystyki","Statystyki"],["terminy","Terminy"],["wiecej","Więcej"]];
const S={tab:"start",pojazdy:[],hPoj:"",hTyp:"",rozwin:new Set(),sPoj:null,sOkres:"rok",sWid:"spalanie"};
try{const z=JSON.parse(localStorage.getItem("pojazdy_ui")||"{}");Object.assign(S,z)}catch(e){}
function zapamietaj(){try{localStorage.setItem("pojazdy_ui",JSON.stringify({tab:S.tab,hPoj:S.hPoj,sPoj:S.sPoj,sOkres:S.sOkres,sWid:S.sWid}))}catch(e){}}
function tabs(){$("#tabs").innerHTML=TABS.map(([k,n])=>`<button type="button" data-t="${k}" class="${S.tab===k?"on":""}">${ICO[{start:"start",historia:"hist",statystyki:"stat",terminy:"term",wiecej:"wiecej"}[k]]}${n}</button>`).join("");
 $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;zapamietaj();pokaz()})}
async function pokaz(){tabs();$("#fab").hidden=!(S.tab==="start"||S.tab==="historia");$("#topx").innerHTML="";
 try{S.pojazdy=await api("pojazdy");await ({start:vStart,historia:vHistoria,statystyki:vStat,terminy:vTerminy,wiecej:vWiecej})[S.tab]()}
 catch(e){$("#main").innerHTML=`<div class="card bad">Nie udało się wczytać: ${esc(e.message)}</div>`}}
const ikona=p=>p.rodzaj==="motocykl"?ICO.moto:ICO.auto;
const zPradem=p=>p.rodzaj==="phev"||p.rodzaj==="ev";
function chipTerm(t){return `<span class="chip ${t.po_terminie?"bad":(t.pilne?"warn":"")}">${esc(t.opis)}</span>`}
const dataPL=s=>{if(!s)return"";const d=s.slice(0,10).split("-");return d[2]+"."+d[1]+"."+d[0]};
const chipPol=st=>`<span class="chip ${st.poziom||""}">${esc(st.opis)}</span>`;
const skrot=z=>z==="AC"?"AC":(z==="OC"?"OC":(z==="OC+AC"?"AC":"P"));
function kartaPolisy(x){const st=x.stan,n=st.liczba_rat||1,pz=Math.round(100*st.zaplaconych/n);
 const nast=st.nastepna?`następna: ${zl(st.nastepna.kwota,2)} do ${dataPL(st.nastepna.termin)}`:"wszystkie raty zapłacone";
 const kon=st.dni_do_konca>=0&&st.dni_do_konca<=120&&st.nastepna?` · koniec za ${st.dni_do_konca} dni`:"";
 return `<div class="card" data-pol="${x.id}" style="cursor:pointer"><div class="row"><div class="dot sh">${skrot(x.zakres)}</div><div class="sp"><div class="t" style="font-weight:700">${esc(x.pojazd)} · ${esc(x.nazwa)}</div><div class="mut sm">${st.waznosc==="przyszla"?"od "+dataPL(x.od)+" ":""}${st.waznosc==="wygasla"?"wygasła ":"ważna do "}${dataPL(x.do)} · opłacona ${st.zaplaconych} z ${n}</div></div>${chipPol(st)}</div>
 <div class="prog" style="display:flex"><b style="width:${pz}%;background:var(--ok);border-radius:0"></b></div><div class="mut xs" style="margin-top:4px">${nast}${kon}</div></div>`}
function podepnijPolisy(root){(root||document).querySelectorAll("[data-pol]").forEach(e=>e.onclick=()=>arkuszPolisaWidok(+e.dataset.pol))}

/* ---------- START */
async function vStart(){const d=await api("start");$("#tytul").textContent="Pojazdy";
 $("#topx").innerHTML=`<span class="chip">${MIESD[+d.miesiac.slice(5)-1].toLowerCase()}</span>`;
 let h="";
 for(const x of d.polisy||[])h+=`<div class="card row banner" data-pol="${x.id}">${chipPol(x)}<span class="sp">${esc(x.nastepna&&x.opis.startsWith("rata")?"Rata "+x.nazwa+" "+zl(x.nastepna.kwota,2):x.nazwa)} · ${esc(x.pojazd)}${x.nastepna&&x.opis.startsWith("rata")?" · "+dzien(x.nastepna.termin):" · do "+dzien(x.do)}</span><span class="mut">›</span></div>`;
 for(const t of d.terminy.filter(t=>t.pilne))h+=`<div class="card row banner" data-term="${t.id}">${chipTerm(t)}<span class="sp">${esc(t.nazwa)} · ${esc(t.pojazd)}${t.nastepny_data?" · "+dzien(t.nastepny_data):""}</span><span class="mut">›</span></div>`;
 for(const c of d.pojazdy){const s=c.srednie||{},m=c.miesiac||{},ev=c.rodzaj==="phev"||c.rodzaj==="ev";
  const razem=(m.paliwo||0)+(m.prad||0)+(m.inne||0);const pc=v=>razem?(100*v/razem).toFixed(1):0;
  const opis=[c.rodzaj==="phev"?"PHEV":(c.rodzaj==="motocykl"?"motocykl":"auto"),c.przebieg!=null?nf(c.przebieg,0)+" km":"przebieg nieznany"];
  if(ev&&c.bateria!=null)opis.push("bateria "+nf(c.bateria,0)+" %");
  h+=`<div class="card"><div class="row"><div class="ico">${ikona(c)}</div><div class="sp"><div class="vname">${esc(c.nazwa)}</div><div class="mut sm">${opis.join(" · ")}</div></div></div>
  <div class="stats">
   <div class="stat"><div class="v fuel">${nf(s.l100)}</div><div class="l">l/100 km</div></div>
   ${ev?`<div class="stat"><div class="v ev">${zakres(s)}</div><div class="l">kWh/100 km</div></div>`:`<div class="stat"><div class="v">${nf(c.ostatni_odcinek?c.ostatni_odcinek.l100:null)}</div><div class="l">ostatni bak</div></div>`}
   <div class="stat"><div class="v">${nf(s.zl100)}</div><div class="l">zł/100 km</div></div></div>
  ${!s.km?`<div class="note" style="margin-top:6px">Spalanie pojawi się po dwóch tankowaniach do pełna.</div>`:`<div class="xs mut" style="margin-top:4px">średnio z ostatnich ${nf(s.km,0)} km${ev&&s.kwh100==null?" · prąd i łączny koszt po pierwszym pełnym baku z zapisanymi ładowaniami":""}</div>`}
  ${ev&&c.kwh100_licznik?`<div class="xs mut" style="margin-top:2px">z liczników ładowarek (na sucho): ${nf(c.kwh100_licznik.kwh100)} kWh/100 km · ${nf(c.kwh100_licznik.kwh,1)} kWh na ${nf(c.kwh100_licznik.km,0)} km od ${dzien(c.kwh100_licznik.od)}</div>`:""}
  <div class="row sm" style="margin-top:8px"><span class="mut">W tym miesiącu</span><span class="sp"></span><span class="num">${zl(razem)}</span></div>
  <div class="split"><b style="width:${pc(m.paliwo)}%;background:var(--acc2)"></b><b style="width:${pc(m.prad)}%;background:var(--ev)"></b><b style="width:${pc(m.inne)}%;background:var(--acc)"></b></div>
  <div class="leg"><span><i style="background:var(--acc2)"></i>paliwo ${zl(m.paliwo)}</span>${ev?`<span><i style="background:var(--ev)"></i>prąd ${zl(m.prad)}</span>`:""}<span><i style="background:var(--acc)"></i>inne ${zl(m.inne)}</span></div>
  <div class="pchips">${(c.polisy||[]).map(x=>`<span class="chip ${x.waznosc==="wygasla"||x.poziom==="bad"?"bad":(x.waznosc==="wazna"?"ok":"")}" data-pol="${x.id}" style="cursor:pointer">${esc(x.nazwa)} ${x.waznosc==="przyszla"?"od "+dzien(x.od):"do "+dzien(x.do)}</span><span class="chip ${x.do_zaplaty>0&&x.poziom!=="ok"&&x.pilne?"warn":""}">raty ${x.zaplaconych}/${x.liczba_rat}</span>`).join("")||`<span class="chip warn" data-dodpol="${c.id}" style="cursor:pointer">brak polisy · dodaj</span>`}</div></div>`}
 if(!d.pojazdy.length)h+=`<div class="empty">Brak pojazdów. Dodaj je w zakładce Więcej.</div>`;
 $("#main").innerHTML=h;
 document.querySelectorAll("[data-term]").forEach(e=>e.onclick=()=>arkuszZrobione(+e.dataset.term));
 podepnijPolisy();document.querySelectorAll("[data-dodpol]").forEach(e=>e.onclick=()=>arkuszPolisa({pojazd_id:+e.dataset.dodpol}))}

/* ---------- HISTORIA */
async function vHistoria(){$("#tytul").textContent="Historia";
 $("#topx").innerHTML=`<select class="pick" id="hp"><option value="">Wszystkie</option>${S.pojazdy.map(p=>`<option value="${p.id}" ${String(S.hPoj)===String(p.id)?"selected":""}>${esc(p.nazwa)}</option>`).join("")}</select>`;
 $("#hp").onchange=e=>{S.hPoj=e.target.value;zapamietaj();vHistoria()};
 const u=await api("ustawienia");
 const lst=await api("historia?pojazd="+(S.hPoj||"")+"&typ="+(S.hTyp||""));
 let h=`<div class="seg">${[["","Wszystko"],["paliwo","Paliwo"],["prad","Prąd"],["koszty","Koszty"]].map(([k,n])=>`<button type="button" data-ht="${k}" class="${S.hTyp===k?"on":""}">${n}</button>`).join("")}</div><div class="card list">`;
 let mies="";
 const wiersz=x=>{const kto=S.hPoj?"":` · ${esc(x.pojazd)}`;let h="";

function wykresLinia(pts,kol,jedn){if(pts.length<2)return `<div class="note">Wykres pojawi się po co najmniej trzech tankowaniach do pełna.</div>`;
 const W=300,H=130,L=26,R=8,T=10,B=22;const vs=pts.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);if(hi-lo<1){hi+=.5;lo-=.5}lo=Math.max(0,Math.floor(lo));hi=Math.ceil(hi);
 const x=i=>L+(W-L-R)*i/(pts.length-1),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
 const tick=[lo,(lo+hi)/2,hi];let s=`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${jedn}">`;
 for(const t of tick)s+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="2" y="${y(t)+3}">${nf(t,t%1?1:0)}</text>`;
 const d=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
 s+=`<path d="${d} L${x(pts.length-1)} ${H-B} L${L} ${H-B}Z" fill="${kol}" opacity=".12"/><path d="${d}" fill="none" stroke="${kol}" stroke-width="2.2" stroke-linejoin="round"/>`;
 s+=`<circle cx="${x(pts.length-1)}" cy="${y(pts.at(-1).v)}" r="3.5" fill="${kol}"/>`;
 const co=Math.max(1,Math.ceil(pts.length/5));pts.forEach((p,i)=>{if(i%co===0||i===pts.length-1)s+=`<text x="${Math.min(x(i)-10,W-R-26)}" y="${H-6}">${dzien(p.d)}</text>`});
 return s+"</svg>"}
function wykresMiesiace(m,ev=true){const k=Object.keys(m);if(!k.length)return `<div class="note">Brak kosztów w tym okresie.</div>`;
 const W=300,H=150,L=34,R=4,T=10,B=22;const mx=Math.max(...k.map(a=>m[a].razem),1);const st=Math.pow(10,Math.floor(Math.log10(mx)));const top=Math.ceil(mx/st)*st;
 const bw=Math.min(24,(W-L-R)/k.length*.7),gap=(W-L-R)/k.length;const y=v=>T+(H-T-B)*(1-v/top);
 let s=`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Koszty miesięczne">`;
 for(const t of [0,top/2,top])s+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="2" y="${y(t)+3}">${nf(t,0)}</text>`;
 k.forEach((a,i)=>{const cx=L+gap*i+(gap-bw)/2;let b=0;for(const[kk,kol] of [["paliwo","var(--acc2)"],["prad","var(--ev)"],["inne","var(--acc)"]]){const v=m[a][kk];if(v>0){s+=`<rect x="${cx}" y="${y(b+v)}" width="${bw}" height="${y(b)-y(b+v)}" fill="${kol}"><title>${MIESD[+a.slice(5)-1]}: ${kk} ${zl(v)}</title></rect>`;b+=v}}
  if(k.length<=12||i%2===0)s+=`<text x="${cx}" y="${H-6}">${MIES[+a.slice(5)-1]}</text>`});
 return s+`</svg><div class="leg"><span><i style="background:var(--acc2)"></i>paliwo</span>${ev?'<span><i style="background:var(--ev)"></i>prąd</span>':""}<span><i style="background:var(--acc)"></i>serwis, OC, inne</span></div>`}

/* ---------- arkusze */
function arkusz(tytul,html,onSave,extra){const v=document.createElement("div");v.className="veil";
 v.innerHTML=`<div class="sheet" role="dialog" aria-label="${esc(tytul)}"><div class="hd"><button type="button" class="x" aria-label="Zamknij">✕</button><h2>${esc(tytul)}</h2>${onSave?'<button type="button" class="save">Zapisz</button>':""}</div><div class="bd">${html}</div></div>`;
 document.body.appendChild(v);const zamknij=()=>v.remove();
 v.querySelector(".x").onclick=zamknij;v.onclick=e=>{if(e.target===v)zamknij()};
 if(onSave)v.querySelector(".save").onclick=async()=>{try{const r=await onSave(v);if(r!==false){zamknij();pokaz()}}catch(e){toast(e.message)}};
 if(extra)extra(v,zamknij);return v}
const val=(v,id)=>{const e=v.querySelector("#"+id);if(!e)return undefined;if(e.type==="checkbox")return e.checked?1:0;return e.value.trim().replace(",",".")};
const pole=(id,label,value,o={})=>`<div class="f"><label for="${id}">${label}</label><input id="${id}" ${o.type?`type="${o.type}"`:""} ${o.im?`inputmode="${o.im}"`:""} ${o.ph?`placeholder="${esc(o.ph)}"`:""} ${o.cls?`class="${o.cls}"`:""} ${o.list?`list="${o.list}"`:""} value="${esc(typeof value==="number"?+value.toFixed(3):(value??""))}"></div>`;
const wybor=(id,label,opts,value)=>`<div class="f"><label for="${id}">${label}</label><select id="${id}">${opts.map(([k,n])=>`<option value="${esc(k)}" ${String(k)===String(value??"")?"selected":""}>${esc(n)}</option>`).join("")}</select></div>`;
const dtl=s=>{s=(s||"").trim().replace(" ","T");return s.length===10?s+"T12:00":s.slice(0,16)};
const pojOpts=()=>S.pojazdy.filter(p=>p.aktywny).map(p=>[p.id,p.nazwa]);
const usunBtn=(tab,id)=>id?`<button type="button" class="btn del" data-usun="${tab}:${id}">Usuń</button>`:"";
function podepnijUsun(v,zamknij){const b=v.querySelector("[data-usun]");if(!b)return;let raz=false;
 b.onclick=async()=>{if(!raz){raz=true;b.textContent="Na pewno usunąć? Dotknij jeszcze raz";return}const[t,id]=b.dataset.usun.split(":");await post(t+"/"+id+"/usun");zamknij();toast("Usunięte");pokaz()}}

  const pj=S.pojazdy.find(q=>q.id==pid)||{};v.querySelector("#psoc").style.display=(pj.rodzaj==="phev"||pj.rodzaj==="ev")?"":"none";
  if(!x.id){if(!val(v,"data"))v.querySelector("#data").value=p.teraz;const c=v.querySelector("#cena_l");if(!x.cena_l)c.value=p.cena_l??"";const s=v.querySelector("#stacja");if(!x.stacja)s.value=p.stacja||"";

  v.querySelector("#stacje").innerHTML=(p.stacje||[]).map(s=>`<option value="${esc(s)}">`).join("");przelicz()}
 v.querySelectorAll("#tp button").forEach(b=>b.onclick=()=>{pid=+b.dataset.p;v.querySelectorAll("#tp button").forEach(c=>c.classList.toggle("on",c===b));podp()});

/* ---------- POLISY */
const czyPolisa=t=>t.kategoria==="Ubezpieczenie"||/polis|\bOC\b|\bAC\b|ubezpiecz/i.test(t.nazwa||"");
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dD=s=>{const[a,b,c]=s.slice(0,10).split("-").map(Number);return new Date(a,b-1,c)};
function plusMies(s,n){const d=dD(s),y=d.getFullYear(),m=d.getMonth()+n,last=new Date(y,m+1,0).getDate();return iso(new Date(y,m,Math.min(d.getDate(),last)))}
function plusDni(s,n){const d=dD(s);d.setDate(d.getDate()+n);return iso(d)}
function rozlozRaty(od,skl,n){n=Math.max(1,+n||1);const kw=skl?Math.round(100*skl/n)/100:null;const out=[];
 for(let i=0;i<n;i++)out.push({termin:plusMies(od,Math.floor(i*12/n)),kwota:kw==null?null:(i===n-1?Math.round(100*(skl-kw*(n-1)))/100:kw),zaplacono:null});return out}

async function arkuszPolisaWidok(id){const x=await api("polisy/"+id),st=x.stan;
 const kol={wazna:["ok","ważna"],przyszla:["","jeszcze nie działa"],wygasla:["bad","wygasła"]}[st.waznosc];
 const oc=/OC/.test(x.zakres||"");
 const odn=x.odnowiona?`<div class="note">Ta polisa ma już następczynię.</div>`:(oc?`<div class="note">${x.wypowiedziana?"Zaznaczone: zmieniasz ubezpieczyciela – przypomnę, żeby kupić nową przed "+dataPL(x.do)+".":(st.wznowi_sie?"OC wznowi się samo na rok, jeśli nie wypowiesz umowy. Wypowiedzenie najpóźniej "+dataPL(st.wypowiedz_do)+".":"OC wznowi się samo dopiero, gdy wszystkie raty będą zapłacone (i bez wypowiedzenia).")}</div>`:`<div class="note">AC i inne nie wznawiają się z mocy prawa – sprawdź umowę.</div>`);
 arkusz(`${x.pojazd} · ${x.nazwa}`,`<div class="card"><div class="row"><span class="chip ${kol[0]}">${kol[1]}</span><span class="sp"></span>${st.do_zaplaty>0?`<span class="chip ${st.po_terminie?"bad":"warn"}">do zapłaty ${zl(st.do_zaplaty,2)}</span>`:`<span class="chip ok">opłacona</span>`}</div>
  <div class="kv" style="margin-top:6px"><span>Okres</span><span>${dataPL(x.od)} – ${dataPL(x.do)}</span></div>
  <div class="kv"><span>${st.dni_do_konca>=0?"Do końca":"Po końcu"}</span><span>${Math.abs(st.dni_do_konca)} dni</span></div>
  ${x.ubezpieczyciel||x.numer?`<div class="kv"><span>Ubezpieczyciel · nr</span><span>${esc(x.ubezpieczyciel||"–")}${x.numer?" · "+esc(x.numer):""}</span></div>`:""}
  <div class="kv"><span>Składka</span><span>${zl(st.suma,2)} · ${st.liczba_rat} ${st.liczba_rat===1?"rata":(st.liczba_rat<5?"raty":"rat")}</span></div>
  <div class="kv"><span>Zapłacono</span><span>${zl(st.zaplacono,2)} z ${zl(st.suma,2)}</span></div>${x.notatka?`<div class="note">${esc(x.notatka)}</div>`:""}</div>
 <div class="card"><div class="mon" style="padding-top:0">Raty</div>${x.raty.map(r=>{const dni=Math.round((dD(r.termin)-dD(iso(new Date())))/864e5);
  return `<div class="rata"><button type="button" class="ck ${r.zaplacono?"on":""}" data-rata="${r.id}" data-z="${r.zaplacono?1:0}" aria-label="${r.zaplacono?"Cofnij zapłatę":"Zapłacona"}">${r.zaplacono?"✓":""}</button><div class="sp"><div style="font-weight:700">${r.nr} rata · ${zl(r.kwota,2)}</div><div class="mut xs">termin ${dataPL(r.termin)}${r.zaplacono?" · zapłacona "+dataPL(r.zaplacono):(dni<0?" · "+(-dni)+" dni po terminie":" · "+(dni===0?"dziś":"za "+dni+" dni"))}</div></div>${r.zaplacono?"":`<button type="button" class="chip ${dni<0?"bad":"warn"}" data-rata="${r.id}" data-z="0" style="border:0;cursor:pointer">Zapłać</button>`}</div>`}).join("")}</div>
 <div class="note">Odhaczenie raty zapisuje koszt „Ubezpieczenie” w Historii z datą zapłaty. Cofnięcie usuwa ten koszt.</div>
 <div id="zpl" hidden class="card"><div class="two">${pole("zpld","Data zapłaty",iso(new Date()),{type:"date"})}<div class="f"><label>&nbsp;</label><button type="button" class="btn" id="zplok">Zapisz zapłatę</button></div></div></div>
 ${odn}
 <div class="btns">${oc&&!x.odnowiona?`<button type="button" class="btn sec" id="wyp">${x.wypowiedziana?"Jednak zostaję":"Zmieniam ubezpieczyciela"}</button>`:""}${x.odnowiona?"":`<button type="button" class="btn sec" id="odn">Odnów</button>`}</div>
 <button type="button" class="btn sec" id="edp">Edytuj polisę</button>`,null,(v,zamknij)=>{
  let rid=null;
  v.querySelectorAll("[data-rata]").forEach(b=>b.onclick=async()=>{
   if(b.dataset.z==="1"){await post("raty/"+b.dataset.rata+"/zaplac",{cofnij:true});zamknij();toast("Cofnięto zapłatę");pokaz();arkuszPolisaWidok(id);return}
   rid=b.dataset.rata;v.querySelector("#zpl").hidden=false;v.querySelector("#zpl").scrollIntoView({block:"nearest"})});
  v.querySelector("#zplok").onclick=async()=>{if(!rid)return;await post("raty/"+rid+"/zaplac",{data:val(v,"zpld")});zamknij();toast("Rata zapłacona, koszt w Historii");pokaz();arkuszPolisaWidok(id)};
  const w=v.querySelector("#wyp");if(w)w.onclick=async()=>{await post("polisy/"+id,{wypowiedziana:x.wypowiedziana?0:1});zamknij();toast("Zapisane");pokaz();arkuszPolisaWidok(id)};
  const o=v.querySelector("#odn");if(o)o.onclick=async()=>{const r=await post("polisy/"+id+"/odnow");zamknij();pokaz();toast("Nowa polisa na kolejny rok – popraw kwoty");arkuszPolisa(await api("polisy/"+r.id))};
  v.querySelector("#edp").onclick=()=>{zamknij();arkuszPolisa(x)}})}

function arkuszPolisa(x){x=x||{};const nowa=!x.id;
 let raty=(x.raty||[]).map(r=>({termin:r.termin,kwota:r.kwota,zaplacono:r.zaplacono}));
 const zak=[["OC","OC"],["OC+AC","OC + AC"],["AC","AC"],["NNW","NNW"],["Assistance","Assistance"],["inne","inne"]];
 const v=arkusz(nowa?"Nowa polisa":"Edytuj polisę",`${wybor("pojazd_id","Pojazd",pojOpts(),x.pojazd_id)}
 ${wybor("zakres","Zakres",zak,x.zakres||"OC")}
 <div class="two">${pole("od","Od",x.od||"",{type:"date"})}${pole("do","Do (włącznie)",x.do||"",{type:"date"})}</div>
 <div class="two">${pole("skladka","Składka (zł, całość)",x.skladka,{type:"number",im:"decimal"})}${wybor("lr","Liczba rat",[1,2,3,4,6,12].map(n=>[n,n]),raty.length||(x.rata_termin?2:1))}</div>
 <div class="two">${pole("ubezpieczyciel","Ubezpieczyciel",x.ubezpieczyciel)}${pole("numer","Nr polisy",x.numer)}</div>
 <div class="card"><div class="row"><b class="sm sp">Raty</b><button type="button" class="chip acc" id="rozl" style="border:0;cursor:pointer">Rozłóż z liczby rat</button></div><div id="rlist"></div></div>
 <div class="note">Daty i kwoty rat można zmienić (ubezpieczyciel czasem dzieli nierówno). Pierwsza rata przy zakupie zwykle jest od razu zapłacona – zaznacz ją.${x.rata_termin?" Z terminu: rata "+dataPL(x.rata_termin)+" – sprawdź, czy daty się zgadzają.":""}</div>
 ${pole("notatka","Notatka",x.notatka)}${nowa?"":`<button type="button" class="btn del" data-usunpol="${x.id}">Usuń polisę (i koszty jej rat)</button>`}`,
 async v=>{czytaj();const d={pojazd_id:val(v,"pojazd_id"),zakres:val(v,"zakres"),od:val(v,"od"),do:val(v,"do"),skladka:val(v,"skladka"),ubezpieczyciel:val(v,"ubezpieczyciel"),numer:val(v,"numer"),notatka:val(v,"notatka"),raty};
  if(!d.od||!d.do){toast("Podaj daty od i do");return false}if(!raty.length){toast("Dodaj raty");return false}
  if(x.z_terminu)d.z_terminu=x.z_terminu;
  const r=await post("polisy"+(nowa?"":"/"+x.id),d);toast("Polisa zapisana");setTimeout(()=>arkuszPolisaWidok(r.id),50)},
 (v,zamknij)=>{const b=v.querySelector("[data-usunpol]");if(b){let raz=false;b.onclick=async()=>{if(!raz){raz=true;b.textContent="Na pewno? Usunie też koszty zapłaconych rat. Dotknij jeszcze raz";return}await post("polisy/"+x.id+"/usun");zamknij();toast("Usunięte");pokaz()}}});
 const lista=v.querySelector("#rlist");
 function rysuj(){lista.innerHTML=raty.map((r,i)=>`<div class="rr" style="margin-top:6px">${pole("rt"+i,(i+1)+" rata – termin",r.termin||"",{type:"date"})}${pole("rk"+i,"Kwota (zł)",r.kwota,{type:"number",im:"decimal"})}<label class="tog" style="padding-bottom:10px"><input type="checkbox" id="rz${i}" ${r.zaplacono?"checked":""}>zapł.</label></div>`).join("")||`<div class="note">Podaj „Od”, składkę i liczbę rat, potem „Rozłóż z liczby rat”.</div>`}
 function czytaj(){raty=raty.map((r,i)=>{const z=v.querySelector("#rz"+i).checked;return{termin:val(v,"rt"+i),kwota:val(v,"rk"+i),zaplacono:z?(r.zaplacono||(val(v,"rt"+i)<=iso(new Date())?val(v,"rt"+i):iso(new Date()))):null}})}
 function rozloz(){const od=val(v,"od");if(!od){toast("Najpierw data „Od”");return}const stare=raty;raty=rozlozRaty(od,+val(v,"skladka")||null,val(v,"lr"));
  raty.forEach((r,i)=>{if(stare[i]&&stare[i].zaplacono)r.zaplacono=stare[i].zaplacono});
  if(x.rata_termin&&raty.length>1&&!raty.some(r=>r.termin===x.rata_termin))raty[1].termin=x.rata_termin;rysuj()}
 v.querySelector("#rozl").onclick=()=>{czytaj();rozloz()};
 v.querySelector("#od").onchange=()=>{const od=val(v,"od");if(od&&!val(v,"do"))v.querySelector("#do").value=plusDni(plusMies(od,12),-1);if(!raty.length&&od)rozloz()};
 v.querySelector("#lr").onchange=()=>{czytaj();rozloz()};
 rysuj()}

function arkuszPojazd(x){x=x||{rodzaj:"auto",aktywny:1};
 arkusz(x.id?x.nazwa:"Nowy pojazd",`${pole("nazwa","Nazwa",x.nazwa)}
 ${wybor("rodzaj","Rodzaj",[["auto","Auto spalinowe"],["phev","Hybryda z wtyczką (PHEV)"],["ev","Elektryczne"],["motocykl","Motocykl"]],x.rodzaj)}
 <div class="two">${pole("bak_l","Bak (l)",x.bak_l,{type:"number",im:"decimal"})}${pole("bateria_kwh","Bateria (kWh)",x.bateria_kwh,{type:"number",im:"decimal"})}</div>
 ${pole("l100_bez_pradu","Spalanie na samej benzynie (l/100 km, do porównania)",x.l100_bez_pradu,{type:"number",im:"decimal"})}
 ${pole("encja_przebiegu","Encja przebiegu w HA (opcjonalnie)",x.encja_przebiegu,{ph:"sensor.…"})}
 <label class="tog"><input type="checkbox" id="aktywny" ${x.aktywny?"checked":""}>Pokazuj na start</label>`,
 async v=>{const d={};for(const k of ["nazwa","rodzaj","bak_l","bateria_kwh","l100_bez_pradu","encja_przebiegu","aktywny"])d[k]=val(v,k);
  if(!d.nazwa){toast("Wpisz nazwę");return false}await post("pojazdy"+(x.id?"/"+x.id:""),d);toast("Zapisane")})}

function arkuszOdczyt(){arkusz("Przebieg",`${wybor("pojazd_id","Pojazd",pojOpts())}${pole("przebieg","Licznik (km)","",{type:"number",im:"decimal"})}${pole("data","Kiedy",new Date().toISOString().slice(0,10),{type:"date"})}`,
 async v=>{if(!val(v,"przebieg")){toast("Wpisz przebieg");return false}await post("odczyty",{pojazd_id:val(v,"pojazd_id"),przebieg:val(v,"przebieg"),data:val(v,"data")});toast("Zapisane")})}

function arkuszImport(){arkusz("Import z Fuelio",`<div class="note">W Fuelio: Ustawienia → Kopia zapasowa → Eksport (plik .fuelio) albo eksport CSV pojazdu. Tu wczytasz też plik ładowań odczytanych z ekranu auta (CSV: od, do, kwh_bateria). Wybierz plik – najpierw zobaczysz podgląd, nic nie zapisze się bez „Importuj”. Powtórny import pomija to, co już jest.</div>
 <div class="f"><label for="plik">Plik</label><input type="file" id="plik" accept=".fuelio,.zip,.csv"></div><div id="pg"></div>`,null,(v,zamknij)=>{
 v.querySelector("#plik").onchange=async e=>{const f=e.target.files[0];if(!f)return;v.querySelector("#pg").innerHTML='<div class="note">Czytam…</div>';
  try{const r=await api("import/podglad",{method:"POST",headers:{"X-Nazwa-Pliku":encodeURIComponent(f.name)},body:await f.arrayBuffer()});
   let h="";let pod=0;const L=r.ladowania;
   if(L){h+=`<div class="card"><div class="row"><b class="sp">Ładowania z ekranu auta</b><span class="chip">${L.ile} wpisów</span></div><div class="mut sm">${dzien(L.od)} – ${dzien(L.do)} · nowych ${L.nowych}</div>
    <div class="kv"><span>Do baterii</span><span>${nf(L.kwh_bateria,1)} kWh</span></div><div class="kv"><span>Z gniazdka (bateria ÷ ${nf(L.sprawnosc*100,0)} %)</span><span>≈ ${nf(L.kwh_gniazdko,1)} kWh</span></div>
    ${L.prad_od_nowe<L.prad_od_teraz?`<div class="note">Zużycie prądu będzie liczone od ${dzien(L.prad_od_nowe)} (teraz od ${dzien(L.prad_od_teraz)}). Wpisy za miesiąc dzielą się na baki proporcjonalnie do dni.</div>`:""}
    <div class="f" style="margin-top:8px"><label>Do pojazdu</label><select data-plik="ekran"><option value="">Pomiń</option>${r.cele.map(c=>`<option value="${c.id}" ${c.id===L.pojazd_id?"selected":""}>${esc(c.nazwa)}</option>`).join("")}</select></div></div>`}
   for(const p of r.pojazdy){pod+=p.podejrzane.length;
    h+=`<div class="card"><div class="row"><b class="sp">${esc(p.nazwa)}</b><span class="chip">${p.tankowan} tank.</span></div><div class="mut sm">${p.od?dzien(p.od)+" – "+dzien(p.do):"bez tankowań"} · nowych ${p.nowych}${p.kosztow?" · kosztów "+p.kosztow:""}${p.terminow?" · terminów "+p.terminow:""}</div>
    ${p.podejrzane.map(q=>`<div class="warnbox" style="margin-top:6px">${dzien(q.data)}: kwota ${zl(q.kwota,2)}, a litry × cena = ${zl(q.wyliczona,2)}</div>`).join("")}
    <div class="f" style="margin-top:8px"><label>Do pojazdu</label><select data-plik="${esc(p.plik)}"><option value="">Pomiń</option>${r.cele.map(c=>`<option value="${c.id}" ${c.id===p.pojazd_id?"selected":""}>${esc(c.nazwa)}</option>`).join("")}</select></div></div>`}
   if(pod)h+=`<label class="tog"><input type="checkbox" id="popraw" checked>Popraw podejrzane kwoty na litry × cena</label>`;
   h+=`<button type="button" class="btn" id="impz">Importuj</button>`;v.querySelector("#pg").innerHTML=h;
   v.querySelector("#impz").onclick=async()=>{const m={};v.querySelectorAll("select[data-plik]").forEach(s=>{if(s.value)m[s.dataset.plik]=+s.value});
    const w=await post("import/zapisz",{mapowanie:m,popraw:!!(v.querySelector("#popraw")||{}).checked});zamknij();toast(L?`Zaimportowano ładowań: ${w.ladowan}`:`Zaimportowano: ${w.tankowan} tankowań, ${w.kosztow} kosztów`);pokaz()}}
  catch(err){v.querySelector("#pg").innerHTML=`<div class="warnbox">${esc(err.message)}</div>`}}})}

async function edytuj(tab,id){const x=await api(tab+"/"+id);({tankowania:arkuszTankowanie,koszty:arkuszKoszt,ladowania:arkuszLadowanie})[tab](x)}
$("#fab").onclick=()=>arkuszTankowanie();
pokaz();
</script>
</body>
</html>
