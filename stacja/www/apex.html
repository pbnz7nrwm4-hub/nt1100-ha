<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stacja – Apex</title>
<style>
:root{--bg:#F4F5F7;--card:#FFFFFF;--line:#DDE1E7;--line2:#EEF0F3;--ink:#15191F;--ink2:#2A303A;--mut:#4A5260;--acc:#1D5FD1;--okbg:#E6F4EA;--ok:#12632D;--okdot:#1E8E3E;--bad:#B3261E;--badbg:#FCE8E6;--rec:#C62828;--warnbg:#FFF1DC;--warn:#8A4B00;--dis:#E3E7ED;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1B1F25;--line:#2C323B;--line2:#252A31;--ink:#EEF1F5;--ink2:#D5DAE1;--mut:#9AA3B0;--acc:#7EA8F5;--okbg:#173322;--ok:#7FD69A;--okdot:#3DBB63;--bad:#F2A49C;--badbg:#3A1E1C;--rec:#E04B4B;--warnbg:#3A2A12;--warn:#F2C27A;--dis:#2A3038;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:28px 24px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:16px;justify-content:space-between}
h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.01em}
h2{margin:0;font-size:18px;font-weight:700}
.sub{margin:2px 0 0;font-size:14px;color:var(--mut)}
.pill{display:flex;align-items:center;gap:10px;border-radius:999px;padding:10px 18px;font-weight:600;font-size:15px;background:var(--dis);color:var(--mut)}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}
.pill i{width:10px;height:10px;border-radius:50%;background:currentColor;display:block}
.pill.ok i{background:var(--okdot)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.news{flex-direction:row;flex-wrap:wrap;gap:8px 24px;align-items:baseline;padding:16px 20px}
.news b{font-size:13px;letter-spacing:.06em;color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.hd{display:flex;align-items:center;gap:10px}
.hd svg{width:22px;height:22px;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.kv span:nth-child(odd){color:var(--mut)}.kv span:nth-child(even){font-weight:600}
.note{margin:0;font-size:13px;color:var(--mut)}
button{font:600 16px Inter,system-ui,sans-serif;min-height:52px;border-radius:12px;cursor:pointer;padding:0 18px}
.b-main{border:0;background:var(--acc);color:#fff}
.b-rec{border:0;background:var(--rec);color:#fff}
.b-out{border:2px solid var(--ink);background:var(--card);color:var(--ink)}
.b-link{border:0;background:none;color:var(--acc);min-height:44px;padding:0;text-align:left;font-size:14px}
button:disabled{background:var(--dis);color:var(--mut);border:0;cursor:default}
.tag{margin-left:auto;font-size:12px;font-weight:700;color:var(--warn);background:var(--warnbg);border-radius:999px;padding:4px 10px}
ol{margin:0;padding-left:20px;font-size:14px;color:var(--ink2);display:flex;flex-direction:column;gap:4px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;color:var(--mut);font-size:13px;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line2)}
td.okc{color:var(--ok);font-weight:600}td.badc{color:var(--bad);font-weight:600}
ul.hist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.hist li{display:flex;gap:12px}ul.hist li span:first-child{color:var(--mut);min-width:110px}
.list .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line2)}
.list .row:last-child{border-bottom:0}
.only-wide{display:block}.only-narrow{display:none}
select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.sheet{background:var(--card);border-radius:16px;max-width:820px;width:100%;max-height:90vh;display:flex;flex-direction:column;gap:12px;padding:18px}
.sheet textarea{width:100%;flex:1;min-height:50vh;font:12px/1.4 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(max-width:640px){.wrap{padding:18px 16px 40px;gap:14px}h1{font-size:24px}.card{padding:18px;border-radius:14px}.only-wide{display:none}.only-narrow{display:block}}
</style>
<style>
nav{display:flex;gap:8px}
nav a{padding:10px 16px;border-radius:999px;background:var(--dis);color:var(--ink);text-decoration:none;font-weight:600}
nav a.on{background:var(--acc);color:#fff}
input[type=text],input[type=password],input[type=file]{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0;max-width:100%}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row2 input[type=text],.row2 input[type=password]{flex:1;min-width:180px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
.msg{margin:0;padding:10px 14px;border-radius:10px;background:var(--warnbg);color:var(--warn);font-size:14px}
.msg.ok{background:var(--okbg);color:var(--ok)}
.bar{height:10px;border-radius:999px;background:var(--dis);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc)}
.cur{font-size:12px;font-weight:700;color:var(--ok);background:var(--okbg);border-radius:999px;padding:3px 9px}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>Apex</h1><p class="sub">Serwer aplikacji nawigacji na tablet · Stacja</p></div><nav><a href="/">Ekran Tab5</a><a href="/apex" class="on">Apex</a></nav></header>
<div id="app"><p class="note">Ładuję…</p></div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rozm=b=>b>=1048576?(b/1048576).toFixed(1)+" MB":Math.round(b/1024)+" KB";
let SES=null;try{SES=sessionStorage.getItem("apexSesja")}catch(e){}
let D=null,KOM="",KOMOK=false,SEK=null,timer=null;
async function api(p,b,raw){const h={};if(SES)h["X-Sesja"]=SES;if(b!==undefined&&!raw)h["Content-Type"]="application/json";
 const r=await fetch(p,b===undefined?{headers:h}:{method:"POST",headers:h,body:raw?b:JSON.stringify(b)});
 const j=await r.json().catch(()=>({}));if(r.status===401&&SES){SES=null;try{sessionStorage.removeItem("apexSesja")}catch(e){}}
 if(!r.ok)throw new Error(j.blad||("błąd "+r.status));return j}
function ustawSesje(t){SES=t;try{sessionStorage.setItem("apexSesja",t)}catch(e){}}
function msg(t,ok){KOM=t;KOMOK=!!ok}
function render(){const d=D;let h="";
 if(!d||!d.zalogowany){const nowy=d&&!d.pin_ustawiony;
  $("#app").innerHTML=`<section class="card" style="max-width:420px"><h2>${nowy?"Ustaw PIN do strony Apex":"Podaj PIN"}</h2>
  <p class="note">${nowy?"Pierwsze uruchomienie: wybierz PIN (4–12 cyfr). Chroni wgrywanie wersji i klucze.":"PIN chroni wgrywanie wersji i klucze aplikacji."}</p>
  <input type="password" id="pin" inputmode="numeric" autocomplete="${nowy?"new-password":"current-password"}" placeholder="PIN">
  ${KOM?`<p class="msg">${esc(KOM)}</p>`:""}
  <button type="button" class="b-main" id="blog">${nowy?"Ustaw PIN":"Wejdź"}</button></section>`;
  const f=async()=>{try{const j=await api(nowy?"/api/apex/pin":"/api/apex/login",{pin:$("#pin").value});ustawSesje(j.sesja);KOM="";odswiez()}catch(e){msg(e.message);render()}};
  $("#blog").onclick=f;$("#pin").onkeydown=e=>{if(e.key==="Enter")f()};return}
 const bz=d.biezaca,k=d.kontakt;
 const kontakt=k?`${esc(k.ts)} · ${esc(k.ip)}${k.wersja?" · Apex "+esc(k.wersja):""}`:"tablet jeszcze się nie połączył";
 h+=`${KOM?`<p class="msg ${KOMOK?"ok":""}">${esc(KOM)}</p>`:""}
 <section class="card"><h2>Stan</h2><div class="kv"><span>Bieżąca wersja</span><span>${bz?esc((d.wersje.find(x=>x.versionCode===bz)||{}).versionName)+" ("+bz+")":"brak – wgraj APK"}</span>
 <span>Ostatnie połączenie tabletu</span><span>${kontakt}</span>
 <span>Klucz aplikacji</span><span>${d.klucz_app_ustawiony?"ustawiony":"<b style='color:var(--bad)'>NIE ustawiony – tablet dostaje 401</b>"}</span>
 <span>Klucz TomTom</span><span>${d.tomtom_ustawiony?"ustawiony":"brak (korki wyłączone)"}</span></div>
 <p class="note">Tablet pobiera: <span class="mono">/api/nav/apex/app/manifest.json</span>, <span class="mono">…/app/apex.apk</span>, <span class="mono">…/config</span>; wysyła <span class="mono">…/log</span>. Dostęp tylko z sieci domowej.</p></section>
 <section class="card"><h2>Wersje</h2>
 <div class="tbl"><table><thead><tr><th>Wersja</th><th>Kod</th><th>Dodano</th><th>Rozmiar</th><th>sha256</th><th></th></tr></thead><tbody>
 ${d.wersje.map(x=>`<tr><td style="font-weight:600">${esc(x.versionName)} ${x.versionCode===bz?'<span class="cur">bieżąca</span>':""}</td><td>${x.versionCode}</td><td>${esc(x.dodano)}</td><td>${rozm(x.bytes)}</td><td class="mono">${esc(x.sha256.slice(0,16))}…</td>
 <td style="white-space:nowrap">${x.versionCode===bz?"":`<button type="button" class="b-link" data-bz="${x.versionCode}">Ustaw jako bieżącą</button> · `}<button type="button" class="b-link" data-us="${x.versionCode}" style="color:var(--bad)">Usuń</button></td></tr>`).join("")||'<tr><td colspan="6" class="note">Brak wgranych wersji.</td></tr>'}
 </tbody></table></div>
 <h2 style="margin-top:8px">Wgraj APK</h2>
 <p class="note">Plik <b>app-debug.apk</b> z GitHub Actions (artefakt nt1100-debug, rozpakowany z ZIP-a). Wersję odczytam z pliku; przyjmuję tylko pakiet pl.nt1100 i wyższy kod niż najnowszy wgrany.</p>
 <input type="file" id="plik" accept=".apk,application/vnd.android.package-archive">
 <details><summary class="note">Ręcznie, gdy wersji nie da się odczytać</summary><div class="row2" style="margin-top:8px"><input type="text" id="vc" inputmode="numeric" placeholder="versionCode"><input type="text" id="vn" placeholder="versionName"></div></details>
 <label class="note"><input type="checkbox" id="wym"> wymuś świadomie (niższy/równy kod albo wersja z formularza)</label>
 <div class="bar" id="pasek" hidden><i></i></div>
 <button type="button" class="b-main" id="bwg">Wgraj APK</button></section>
 <section class="card"><h2>Klucze</h2>
 <div><div class="note">Klucz TomTom (korki, zamknięcia; trzymany tylko tu, nie w repo ani w APK)</div><div class="row2"><input type="password" id="ktt" autocomplete="off" placeholder="${d.tomtom_ustawiony?"ustawiony – wpisz nowy, by zmienić":"wklej klucz"}" value="${SEK?esc(SEK.tomtomKey):""}"><button type="button" class="b-out" id="pokt">${SEK?"Ukryj":"Pokaż"}</button><button type="button" class="b-main" id="zt">Zapisz</button></div></div>
 <div><div class="note">Klucz aplikacji (wpisujesz go raz w Apex: Ustawienia → Połączenia; zmiana wymaga wpisania go na tablecie od nowa)</div><div class="row2"><input type="password" id="kap" autocomplete="off" placeholder="${d.klucz_app_ustawiony?"ustawiony – wpisz nowy, by zmienić":"brak – wygeneruj"}" value="${SEK?esc(SEK.kluczApp):""}"><button type="button" class="b-out" id="pokk">${SEK?"Ukryj":"Pokaż"}</button><button type="button" class="b-main" id="zk">Zapisz</button><button type="button" class="b-out" id="gk">Generuj nowy</button></div></div></section>
 <section class="card"><h2>Dziennik z tabletu</h2>
 <div class="list">${d.dzienniki.map(x=>`<div class="row"><div><div style="font-weight:600" class="mono">${esc(x.plik)}</div><div class="note">${esc(x.kiedy)} · ${rozm(x.bajty)}</div></div><div style="white-space:nowrap">${x.plik.endsWith(".txt")?`<button type="button" class="b-link" data-pd="${esc(x.plik)}" style="display:inline">Podgląd</button> · `:""}<button type="button" class="b-link" data-pb="${esc(x.plik)}" style="display:inline">Pobierz</button></div></div>`).join("")||'<p class="note">Brak dzienników – w Apex przycisk „Wyślij dziennik”.</p>'}</div></section>
 <section class="card"><h2>PIN</h2><div class="row2"><input type="password" id="npin" inputmode="numeric" placeholder="nowy PIN (4–12 cyfr)"><button type="button" class="b-out" id="zp">Zmień PIN</button><button type="button" class="b-link" id="wyl">Wyloguj</button></div></section>`;
 $("#app").innerHTML=h;
 const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
 on("#bwg",wgraj);on("#wyl",()=>{SES=null;try{sessionStorage.removeItem("apexSesja")}catch(e){}SEK=null;D={zalogowany:false,pin_ustawiony:true};render()});
 on("#zp",()=>akcja("/api/apex/pin",{pin:$("#npin").value},"PIN zmieniony."));
 on("#zt",()=>akcja("/api/apex/ustawienia",{tomtomKey:$("#ktt").value},"Klucz TomTom zapisany."));
 on("#zk",()=>akcja("/api/apex/ustawienia",{kluczApp:$("#kap").value},"Klucz aplikacji zapisany."));
 on("#gk",async()=>{if(!confirm("Wygenerować nowy klucz aplikacji? Tablet przestanie się łączyć, dopóki nie wpiszesz nowego w Apex."))return;await akcja("/api/apex/ustawienia",{kluczApp:"generuj"},"Nowy klucz aplikacji wygenerowany – pokaż go i wpisz na tablecie.");await pokaz(true)});
 const pok=async()=>{if(SEK)SEK=null;else SEK=await api("/api/apex/sekrety");render()};
 on("#pokt",()=>pok().catch(e=>{msg(e.message);render()}));on("#pokk",()=>pok().catch(e=>{msg(e.message);render()}));
 document.querySelectorAll("[data-bz]").forEach(b=>b.onclick=()=>akcja("/api/apex/biezaca",{versionCode:+b.dataset.bz},"Ustawiono bieżącą wersję."));
 document.querySelectorAll("[data-us]").forEach(b=>b.onclick=async()=>{const vc=+b.dataset.us;if(!confirm("Usunąć wersję "+vc+"? Tego nie da się cofnąć."))return;
  try{await api("/api/apex/usun",{versionCode:vc,potwierdz:true});msg("Wersja usunięta.",true)}catch(e){if(/wymuś/.test(e.message)&&confirm(e.message+"\n\nUsunąć mimo to?")){try{await api("/api/apex/usun",{versionCode:vc,potwierdz:true,wymus:true});msg("Wersja usunięta.",true)}catch(e2){msg(e2.message)}}else msg(e.message)}odswiez()});
 document.querySelectorAll("[data-pd]").forEach(b=>b.onclick=async()=>{try{const r=await fetch("/api/apex/dziennik/"+encodeURIComponent(b.dataset.pd)+"?podglad=1",{headers:{"X-Sesja":SES}});arkusz(await r.text())}catch(e){msg(e.message);render()}});
 document.querySelectorAll("[data-pb]").forEach(b=>b.onclick=async()=>{try{const r=await fetch("/api/apex/dziennik/"+encodeURIComponent(b.dataset.pb),{headers:{"X-Sesja":SES}});if(!r.ok)throw new Error("błąd "+r.status);const u=URL.createObjectURL(await r.blob());const a=document.createElement("a");a.href=u;a.download=b.dataset.pb;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}catch(e){msg(e.message);render()}})}
async function pokaz(){SEK=await api("/api/apex/sekrety");render()}
async function akcja(p,b,ok){try{await api(p,b);msg(ok,true)}catch(e){msg(e.message)}odswiez()}
function wgraj(){const f=$("#plik").files[0];if(!f){msg("Wybierz plik APK.");render();return}
 const q=new URLSearchParams();if($("#vc").value)q.set("vc",$("#vc").value.trim());if($("#vn").value)q.set("vn",$("#vn").value.trim());if($("#wym").checked)q.set("wymus","1");
 const x=new XMLHttpRequest();x.open("POST","/api/apex/wgraj?"+q);x.setRequestHeader("X-Sesja",SES);
 $("#pasek").hidden=false;$("#bwg").disabled=true;
 x.upload.onprogress=e=>{if(e.lengthComputable)$("#pasek i").style.width=(100*e.loaded/e.total)+"%"};
 x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}
  if(x.status===401){SES=null}
  msg(x.status===200?"Wgrano "+j.wersja.versionName+" ("+j.wersja.versionCode+"), jest bieżąca. Tablet zaktualizuje się przy najbliższym sprawdzeniu.":(j.blad||"Błąd "+x.status),x.status===200);odswiez()};
 x.onerror=()=>{msg("Połączenie przerwane podczas wgrywania.");odswiez()};x.send(f)}
function arkusz(t){const v=document.createElement("div");v.className="veil";
 v.innerHTML=`<div class="sheet" role="dialog"><div class="hd"><h2>Dziennik</h2><span style="flex:1"></span><button type="button" class="b-out" id="zam">Zamknij</button></div><textarea readonly></textarea></div>`;
 v.querySelector("textarea").value=t;document.body.appendChild(v);v.querySelector("#zam").onclick=()=>v.remove();v.onclick=e=>{if(e.target===v)v.remove()}}
async function odswiez(){clearTimeout(timer);try{D=await api("/api/apex/stan");if(!document.querySelector(".veil")&&!(document.activeElement&&/INPUT/.test(document.activeElement.tagName)))render()}catch(e){$("#app").innerHTML=`<p class="note">Stacja nie odpowiada: ${esc(e.message)}</p>`}
 timer=setTimeout(odswiez,20000)}
odswiez();
</script>
</body>
</html>
