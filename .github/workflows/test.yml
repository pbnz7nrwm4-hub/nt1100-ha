name: Testy dodatku
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: osmium (budowa mapy w testach)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Testy serwera i strażnik nazw części
        run: python3 -m unittest discover -s tests -v
