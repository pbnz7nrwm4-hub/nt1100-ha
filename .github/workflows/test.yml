name: Testy dodatku
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testy serwera i strażnik nazw części
        run: python3 -m unittest discover -s tests -v
