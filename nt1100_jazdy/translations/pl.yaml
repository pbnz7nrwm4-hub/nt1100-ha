configuration:
  powiadomienie:
    name: Powiadomienie po jezdzie
    description: "Wygodniej wybrac telefon w panelu dodatku (Ustawienia -> Powiadomienie po jezdzie). Tu: nazwa uslugi bez notify., np. mobile_app_iphone_adriana; puste = dzwonek w Home Assistant."
  telegram_chat:
    name: Telegram - numer czatu
    description: "Numer czatu Telegram (integracja telegram_bot w HA), na ktory ida powiadomienia po jezdzie, o serwisie i o baterii skrzynki. Puste = bez Telegrama."
  adres_spoza_domu:
    name: Adres spoza domu
    description: Adres dodatku przez Cloudflare (pokazywany na stronie do wpisania w skrzynce).
  klucz:
    name: Wlasny klucz
    description: Zostaw puste - dodatek sam wygeneruje klucz i pokaze go w zakladce Ustawienia.
  mqtt_host:
    name: Broker MQTT (opcjonalnie)
    description: "Puste = broker z Home Assistant (dodatek Mosquitto) - adres i login dodatek dostaje sam. Wpisz tylko dla innego brokera."
  mqtt_port:
    name: Port MQTT
    description: Zwykle 1883.
  mqtt_user:
    name: Uzytkownik MQTT (opcjonalnie)
    description: "Puste = login nadany automatycznie przez Home Assistant. Mozesz wpisac wlasnego uzytkownika (np. utworzonego w Mosquitto)."
  mqtt_password:
    name: Haslo MQTT
    description: Haslo uzytkownika powyzej.
network:
  8098/tcp: Odbior jazd ze skrzynki (tylko z kluczem)
