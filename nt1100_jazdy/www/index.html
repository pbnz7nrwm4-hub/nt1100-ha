<script>
const C=[[15,'#8fa3b8','do 15°'],[25,'#2f9e44','15–25°'],[35,'#f2c200','25–35°'],[45,'#f76707','35–45°'],[999,'#e03131','ponad 45°']];
const col=l=>{if(l===null||isNaN(l))return '#8fa3b8';const a=Math.abs(l);for(const c of C)if(a<c[0])return c[1];return C[4][1]};
const fmt=(v,d)=>v===null||v===undefined||isNaN(v)?'–':Number(v).toFixed(d||0);
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!==undefined)e.textContent=txt;return e};
const pad=n=>String(n).padStart(4,'0');
const dur=m=>m===null||m===undefined||isNaN(m)?'–':(m>=60?Math.floor(m/60)+' h '+String(Math.round(m%60)).padStart(2,'0')+' min':Math.round(m)+' min');
let DATA=null,LEAF=null,STOP=null,AX='t',CSEL=null;try{AX=localStorage.getItem('nt-axis')||'t'}catch(e){}
let FIL={y:'',fav:false,q:''},LT=0,SY=null;
const PASS=()=>{try{return localStorage.getItem('nt-pass')||''}catch(e){return ''}};
async function api(url,o){o=Object.assign({},o||{});const h=Object.assign({},o.headers||{});const p=PASS();if(p)h['X-Haslo']=p;o.headers=h;let r=await fetch(url,o);
if(r.status===401&&!isHA()){const v=prompt('Zmiany przez sieć domową albo hotspot wymagają hasła Wi-Fi skrzynki „NT1100” (tego z ekranu skrzynki). Podaj je:');if(v){try{localStorage.setItem('nt-pass',v)}catch(e){}h['X-Haslo']=v;r=await fetch(url,o)}}return r}
const WX=[[[0],'bezchmurnie','☀️'],[[1],'przeważnie słonecznie','🌤️'],[[2],'częściowe zachmurzenie','⛅'],[[3],'pochmurno','☁️'],[[45,48],'mgła','🌫️'],[[51,53,55,56,57],'mżawka','🌦️'],[[61,63,65,66,67],'deszcz','🌧️'],[[71,73,75,77,85,86],'śnieg','🌨️'],[[80,81,82],'przelotny deszcz','🌦️'],[[95,96,99],'burza','⛈️']];
const wmo=c=>{for(const w of WX)if(w[0].includes(c))return w;return[[],'','']};
function curvy(pts){const R=6371000,rad=Math.PI/180,dx=(a,b)=>(b[1]-a[1])*rad*Math.cos((a[0]+b[0])/2*rad),dy=(a,b)=>(b[0]-a[0])*rad,dm=(a,b)=>R*Math.hypot(dx(a,b),dy(a,b)),br=(a,b)=>(Math.atan2(dx(a,b),dy(a,b))/rad+360)%360;
let turn=0,dist=0,an=null,lb=null;for(const p of pts){if(!an){an=p;continue}const d=dm(an,p);if(d<50)continue;dist+=d;const b=br(an,p);if(lb!==null&&(p[3]===null||p[3]>=10)){const t=Math.abs((b-lb+540)%360-180);if(t>=4&&t<=150)turn+=t}lb=b;an=p}
const cs=[];let cur=null;pts.forEach((p,i)=>{const l=p[2],v=p[3];if(l!==null&&v!==null&&Math.abs(l)>=15&&v>=15){if(!cur||(p[5]!==null&&cur.te!==null&&p[5]-cur.te>2)){if(cur)cs.push(cur);cur={i,lean:l,speed:v,t:p[5],te:p[5]}}else{if(Math.abs(l)>Math.abs(cur.lean))Object.assign(cur,{i,lean:l,speed:v,t:p[5]});cur.te=p[5]}}else if(cur&&(p[5]===null||cur.te===null||p[5]-cur.te>2)){cs.push(cur);cur=null}});if(cur)cs.push(cur);
const km=dist/1000,dk=km>=1?turn/km:null;return{deg_km:dk===null?null:Math.round(dk),rating:dk===null?null:dk<30?'prosta':dk<80?'lekko kręta':dk<150?'kręta':'bardzo kręta',corners:cs.length,per100:km<1?null:Math.round(cs.length*100/km),left:cs.filter(c=>c.lean<0).length,right:cs.filter(c=>c.lean>0).length,top:cs.slice().sort((a,b)=>Math.abs(b.lean)-Math.abs(a.lean)).slice(0,5)}}
function probs(p){const o=[];if(!p)return o;const g=p.gnss;if(g){if(!g.found)o.push('GPS nie działał');else{if(g.fix_pct<80)o.push('GPS miał pozycję tylko przez '+fmt(g.fix_pct)+'% czasu');if(g.outages>3)o.push('GPS gubił pozycję '+g.outages+'× (razem '+fmt(g.outage_s)+' s)')}}
if(p.imu&&!p.imu.ok)o.push('czujnik ruchu nie działał');if(p.calib&&!p.calib.ok)o.push('przechył bez kalibracji');if(p.can&&p.can.mode===2&&p.can.obd==='offline')o.push('brak danych z motocykla (OBD)');
if(p.power&&p.power.vbus_drops>0)o.push('zasilanie zanikało '+p.power.vbus_drops+'×');if(p.storage&&p.storage.failed)o.push('błąd karty pamięci');else if(p.storage&&p.storage.dropped>0)o.push('karta nie nadążała (zgubione próbki: '+p.storage.dropped+')');
if(typeof p.battery==='number'&&p.battery>=0&&p.battery<20)o.push('bateria skrzynki '+p.battery+'%');return o}
function rkey(r){const s=r.summary;return s&&s.start?Date.parse(s.start):0}
function kmArr(pts){const km=[0];for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],dy=(b[0]-a[0])*111.2,dx=(b[1]-a[1])*111.2*Math.cos(a[0]*Math.PI/180),d=Math.hypot(dx,dy);km.push(km[i-1]+(d<5?d:0))}return km}
function idxIn(xs,x){let a=0,b=xs.length-1;while(a<b){const m=(a+b)>>1;if(xs[m]<x)a=m+1;else b=m}return a}
function hms(s){s=Math.round(s);return s>=3600?Math.floor(s/3600)+' h '+String(Math.floor(s%3600/60)).padStart(2,'0')+' min':s>=60?Math.floor(s/60)+' min '+String(s%60).padStart(2,'0')+' s':s+' s'}
function mm(items){const d=el('div','mm');for(const [v,u,l] of items){const x=el('div');const b=el('b',null,v);if(v!=='–'&&u)b.append(el('small',null,u));x.append(b,el('span',null,l));d.append(x)}return d}
function zones(pts){const sec=C.map(()=>0);let L=0,R=0;for(let i=0;i<pts.length;i++){const p=pts[i],l=p[2];if(l===null||p[3]===null||p[3]<10)continue;const a=Math.abs(l);let k=0;while(k<C.length-1&&a>=C[k][0])k++;sec[k]++;if(a>=15){if(l<0)L++;else R++}}
const tot=sec.reduce((a,b)=>a+b,0);if(tot<10)return null;const k=el('div','card');k.append(el('b',null,'Czas w strefach przechyłu'));const bar=el('div','zb');k.append(bar);
C.forEach((c,i)=>{if(!sec[i])return;const s=el('span');s.style.width=(100*sec[i]/tot)+'%';s.style.background=c[1];bar.append(s)});
C.forEach((c,i)=>{const r=el('div','zr');const d=el('i');d.style.background=c[1];r.append(d,el('span',null,c[2]),el('b',null,hms(sec[i])),el('small','mut',Math.round(100*sec[i]/tot)+'%'));k.append(r)});
if(L+R>0)k.append(el('p','mut','Zakręty od 15°: w lewo '+Math.round(100*L/(L+R))+'%, w prawo '+Math.round(100*R/(L+R))+'%. Liczone przy prędkości od 10 km/h.'));return k}
function when(s){if(!s||!s.start)return 'brak czasu GPS';const d=new Date(s.start);
return d.toLocaleDateString('pl-PL',{weekday:'short',day:'numeric',month:'short',year:'numeric'})+', '+d.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})}
function state(f,s){if(!DATA.upload)return['',''];if(f.lpbad!==undefined)return['odrzucona','bad'];if(s&&!(s.distance_km>0.1))return['',''];if(f.up!==undefined)return['wysłana','ok'];if(f.lp!==undefined)return['czeka na wysyłkę','wait'];return['','']}
function stat(g,v,u,label){const d=el('div');d.append(el('b',null,v+(v==='–'?'':u)),el('span',null,label));g.append(d)}
function stats(s,x){const g=el('div','grid');
const nv=(a,b)=>a!==undefined&&a!==null?a:b;
stat(g,fmt(s.distance_km,1),' km','dystans');stat(g,fmt(s.avg_speed),' km/h','średnia w ruchu');stat(g,fmt(s.max_speed),' km/h','prędkość maks.');
stat(g,dur(s.moving_min),'','w ruchu');stat(g,s.total_min>=s.moving_min?dur(s.total_min-s.moving_min):'–','','postój');stat(g,dur(s.total_min),'','łącznie');

const ex=[];if(p.markers)ex.push('znaczniki: '+p.markers);if(p.battery>=0)ex.push('bateria na końcu: '+p.battery+'%');if(p.fw)ex.push('oprogramowanie '+p.fw);if(ex.length)k.append(el('small','mut',ex.join(' · ')));P.append(k)}
function curvyCard(P,pts,D,map){const v=curvy(pts);if(v.deg_km===null&&!v.corners)return;const k=el('div','card');k.append(el('b',null,'Krętość trasy'));
k.append(mm([[v.rating||'–','','ocena'],[fmt(v.deg_km),' °/km','zmiana kierunku'],[fmt(v.per100),'','zakrętów na 100 km']]));
k.append(el('small','mut','Ocena z samego kształtu trasy: suma zmian kierunku (co 50 m) na kilometr. Do 30 °/km prosta, do 80 lekko kręta, do 150 kręta, wyżej bardzo kręta.'+(v.corners?' Zakręty z przechyłem od 15°: '+v.corners+' (w lewo '+v.left+', w prawo '+v.right+').':'')));
if(v.top.length){k.append(el('h2',null,'Najgłębsze zakręty'));v.top.forEach((c,j)=>{const row=el('div','leg');row.append(el('span',null,(j+1)+'. '+(c.lean<0?'w lewo ':'w prawo ')+fmt(Math.abs(c.lean))+'°'),el('span','mut',fmt(c.speed)+' km/h'+(c.t!==null?' · '+hms(c.t):'')));row.onclick=()=>{if(D._seek)D._seek(c.t!==null?c.t:c.i)};k.append(row);
if(map){try{L.circleMarker([pts[c.i][0],pts[c.i][1]],{radius:9,color:'#fff',weight:2,fillColor:'#7950f2',fillOpacity:1}).bindTooltip(String(j+1),{permanent:true,direction:'top',offset:[0,-6],className:'lab'}).addTo(map)}catch(e){}}})}P.append(k)}
reload().catch(()=>{document.getElementById('info').textContent='błąd wczytywania listy jazd'});
</script><script src="nav.js"></script></body></html>
