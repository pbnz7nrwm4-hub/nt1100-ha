<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:#0b1220;--card:#121b2d;--card2:#18233a;--ink:#e8edf6;--mut:#8b98ae;--line:#24324d;--acc:#3d8bfd;--acc2:#f76707;--thumb:#9cc2ff;--ok:#40c057;--warn:#fab005;--bad:#fa5252;color-scheme:dark}

*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}

h1{font-size:22px;margin:0;letter-spacing:.02em}h1 em{font-style:normal;color:var(--acc)}h2{font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:22px 4px 6px}

a{color:var(--acc)}button,select,input{font:inherit;color:var(--ink)}button{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card2);cursor:pointer}button:hover{border-color:var(--acc)}

.files a{display:inline-block;margin:4px 12px 4px 0}.pl{font-size:14px;margin-top:2px;color:var(--mut)}
.tw{overflow-x:auto;margin-top:6px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px}.mono{font-family:ui-monospace,Menlo,monospace;white-space:nowrap}.chg{color:var(--acc2);font-weight:700}.scan{cursor:pointer}

.gauge{display:block;width:100%;max-width:420px;margin:6px auto 0}.pinfo{margin:6px 0 8px;font-variant-numeric:tabular-nums;text-align:center}.pc{display:flex;gap:8px;align-items:center;justify-content:center}.pc button{min-width:52px}.pc select{padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card2)}input[type=range]{width:100%;margin-top:12px;accent-color:var(--acc)}
.st{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}.st:first-of-type{border-top:0}.st .dot{margin-top:7px}.st div{flex:1;min-width:0}.st b{font-weight:600}.st .v{float:right;color:var(--mut);font-variant-numeric:tabular-nums;margin-left:8px}.st small{display:block}

.mm{display:flex;gap:10px;margin:8px 0 2px;flex-wrap:wrap}.mm div{flex:1;min-width:58px;border-top:1px solid var(--line);padding-top:6px}.mm b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.mm b small{font-size:13px;font-weight:400}.mm span{font-size:12px;color:var(--mut)}
.zb{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0 8px;background:var(--line)}.zr{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}.zr i{width:12px;height:12px;border-radius:3px;flex:none}.zr span:nth-child(2){flex:1}.zr b{font-variant-numeric:tabular-nums;font-weight:600}.zr small{width:44px;text-align:right}

.f{display:grid;gap:4px;margin:10px 0}.f label{font-size:13px;color:var(--mut)}.f input,.f select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2)}
details summary{cursor:pointer;color:var(--acc);margin:6px 0}.ok-msg{color:var(--ok)}.bad-msg{color:var(--bad)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:1000}

nav.tabs button.on{color:var(--acc);border-top-color:var(--acc)}nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.star{border:0;background:none;font-size:24px;padding:0 4px;color:var(--warn);line-height:1}.star:not(.on){color:var(--mut)}.acts input{flex:1;min-width:0;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2)}.acts select{padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card2);max-width:100%}
.trip{cursor:pointer;border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}.th.wide{width:100%;height:120px;flex:none;margin-top:10px}.legs{margin-top:8px;border-top:1px solid var(--line)}.leg{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}.leg:hover{color:var(--acc)}
.hb{display:grid;grid-template-columns:84px 1fr 52px;gap:8px;align-items:center;font-size:13px;margin:7px 0}.hb div{height:10px;background:var(--card2);border-radius:5px;overflow:hidden}.hb i{display:block;height:100%}.hb span:last-child{text-align:right;font-variant-numeric:tabular-nums}

</style></head><body>
<header class="top"><div><h1>NT1100 <em>Telemetria</em></h1><small id="info">wczytywanie...</small></div><div id="pills" class="pills"></div></header>
<main>
<section id="v-rides"><div id="list"></div><div id="detail" hidden></div></section>
<section id="v-stats" hidden></section>
<section id="v-state" hidden></section>
<section id="v-set" hidden><div class="card" id="upd"><b>Aktualizacja oprogramowania</b>
<form method="POST" action="update" enctype="multipart/form-data" style="margin-top:8px">
<input type="file" name="fw" accept=".bin"> <button type="submit">Wgraj</button></form>
<small>Po wgraniu skrzynka uruchomi się ponownie.</small></div></section>
</main>
<nav class="tabs">
<button id="t-rides" class="on" onclick="tab('rides')"><svg viewBox="0 0 24 24"><path d="M2 20l6-10 4 6 3-4 7 8z"/><circle cx="17" cy="5" r="2"/></svg>Jazdy</button>
<button id="t-stats" onclick="tab('stats')"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Statystyki</button>
<button id="t-state" onclick="tab('state')"><svg viewBox="0 0 24 24"><path d="M2 12h4l3-7 5 14 3-7h5"/></svg>Stan</button>
<button id="t-set" onclick="tab('set')"><svg viewBox="0 0 24 24"><path d="M3 6h11M18 6h3M3 12h3M10 12h11M3 18h13M20 18h1"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Ustawienia</button>
</nav>
<script>
const C=[[15,'#8fa3b8','do 15°'],[25,'#2f9e44','15–25°'],[35,'#f2c200','25–35°'],[45,'#f76707','35–45°'],[999,'#e03131','ponad 45°']];
const col=l=>{if(l===null||isNaN(l))return '#8fa3b8';const a=Math.abs(l);for(const c of C)if(a<c[0])return c[1];return C[4][1]};
const fmt=(v,d)=>v===null||v===undefined||isNaN(v)?'–':Number(v).toFixed(d||0);
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!==undefined)e.textContent=txt;return e};
const pad=n=>String(n).padStart(4,'0');
const dur=m=>m===null||m===undefined||isNaN(m)?'–':(m>=60?Math.floor(m/60)+' h '+String(Math.round(m%60)).padStart(2,'0')+' min':Math.round(m)+' min');
let DATA=null,LEAF=null,STOP=null,AX='t',CSEL=null;try{AX=localStorage.getItem('nt-axis')||'t'}catch(e){}
function kmArr(pts){const km=[0];for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],dy=(b[0]-a[0])*111.2,dx=(b[1]-a[1])*111.2*Math.cos(a[0]*Math.PI/180),d=Math.hypot(dx,dy);km.push(km[i-1]+(d<5?d:0))}return km}
function idxIn(xs,x){let a=0,b=xs.length-1;while(a<b){const m=(a+b)>>1;if(xs[m]<x)a=m+1;else b=m}return a}
function hms(s){s=Math.round(s);return s>=3600?Math.floor(s/3600)+' h '+String(Math.floor(s%3600/60)).padStart(2,'0')+' min':s>=60?Math.floor(s/60)+' min '+String(s%60).padStart(2,'0')+' s':s+' s'}
function mm(items){const d=el('div','mm');for(const [v,u,l] of items){const x=el('div');const b=el('b',null,v);if(v!=='–'&&u)b.append(el('small',null,u));x.append(b,el('span',null,l));d.append(x)}return d}
function zones(pts){const sec=C.map(()=>0);let L=0,R=0;for(let i=0;i<pts.length;i++){const p=pts[i],l=p[2];if(l===null||p[3]===null||p[3]<10)continue;const a=Math.abs(l);let k=0;while(k<C.length-1&&a>=C[k][0])k++;sec[k]++;if(a>=15){if(l<0)L++;else R++}}
const tot=sec.reduce((a,b)=>a+b,0);if(tot<10)return null;const k=el('div','card');k.append(el('b',null,'Czas w strefach przechyłu'));const bar=el('div','zb');k.append(bar);
C.forEach((c,i)=>{if(!sec[i])return;const s=el('span');s.style.width=(100*sec[i]/tot)+'%';s.style.background=c[1];bar.append(s)});
C.forEach((c,i)=>{const r=el('div','zr');const d=el('i');d.style.background=c[1];r.append(d,el('span',null,c[2]),el('b',null,hms(sec[i])),el('small','mut',Math.round(100*sec[i]/tot)+'%'));k.append(r)});
if(L+R>0)k.append(el('p','mut','Zakręty od 15°: w lewo '+Math.round(100*L/(L+R))+'%, w prawo '+Math.round(100*R/(L+R))+'%. Liczone przy prędkości od 10 km/h.'));return k}
function when(s){if(!s||!s.start)return 'brak czasu GPS';const d=new Date(s.start);
return d.toLocaleDateString('pl-PL',{weekday:'short',day:'numeric',month:'short',year:'numeric'})+', '+d.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})}
function state(f,s){if(!DATA.upload)return['',''];if(f.lpbad!==undefined)return['odrzucona','bad'];if(s&&!(s.distance_km>0.1))return['',''];if(f.up!==undefined)return['wysłana','ok'];if(f.lp!==undefined)return['czeka na wysyłkę','wait'];return['','']}
function stat(g,v,u,label){const d=el('div');d.append(el('b',null,v+(v==='–'?'':u)),el('span',null,label));g.append(d)}
function stats(s,x){const g=el('div','grid');
const nv=(a,b)=>a!==undefined&&a!==null?a:b;
stat(g,fmt(s.distance_km,1),' km','dystans');stat(g,fmt(s.avg_speed),' km/h','średnia w ruchu');stat(g,fmt(s.max_speed),' km/h','prędkość maks.');
stat(g,dur(s.moving_min),'','w ruchu');stat(g,s.total_min>=s.moving_min?dur(s.total_min-s.moving_min):'–','','postój');stat(g,dur(s.total_min),'','łącznie');
stat(g,fmt(s.max_lean_left),'°','przechył w lewo');stat(g,fmt(s.max_lean_right),'°','przechył w prawo');stat(g,fmt(s.elevation_gain),' m','↑ wznios');
stat(g,fmt(nv(s.elevation_loss,x.loss)),' m','↓ spadek');stat(g,fmt(nv(s.min_alt,x.minAlt)),' m','najniżej');stat(g,fmt(nv(s.max_alt,x.maxAlt)),' m','najwyżej');
stat(g,fmt(s.max_accel_g,2),' g','przyspieszenie');stat(g,fmt(s.max_brake_g,2),' g','hamowanie');stat(g,fmt(s.max_lat_g,2),' g','w zakręcie');
if(s.max_rpm)stat(g,fmt(s.max_rpm),'','obroty maks.');return g}
async function text(url){const r=await fetch(url);if(!r.ok)throw 0;return r.text()}
const parse=txt=>txt.split('\n').map(l=>l.split(',')).filter(a=>a.length>=2&&a[0]!=='').map(a=>{const n=i=>a[i]===''||a[i]===undefined?null:+a[i];return[+a[0],+a[1],n(2),n(3),n(4),n(5),n(6),n(7),n(8),n(9),n(10),n(11)]});
function svgEl(t,a){const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const k in a)e.setAttribute(k,a[k]);return e}
function proj(pts,W,H,P){const lat0=pts.reduce((a,p)=>a+p[0],0)/pts.length;const k=Math.cos(lat0*Math.PI/180);
const xs=pts.map(p=>p[1]*k),ys=pts.map(p=>-p[0]);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
const sc=Math.min((W-2*P)/Math.max(x1-x0,1e-9),(H-2*P)/Math.max(y1-y0,1e-9));const ox=(W-(x1-x0)*sc)/2,oy=(H-(y1-y0)*sc)/2;
return{X:i=>((xs[i]-x0)*sc+ox).toFixed(1),Y:i=>((ys[i]-y0)*sc+oy).toFixed(1),far:i=>{if(i<1)return false;const km=Math.hypot((xs[i]-xs[i-1])*111,(ys[i]-ys[i-1])*111),dt=pts[i][5]!=null&&pts[i-1][5]!=null?pts[i][5]-pts[i-1][5]:0;return dt>0?dt>60||km/dt*3600>300:km>0.5}}}
function thumb(pts,W,H){W=W||96;H=H||72;const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,class:'th'});if(pts.length<2)return svg;const p=proj(pts,W,H,6);
let d='';for(let i=0;i<pts.length;i++)d+=(p.far(i)?'M':i?'L':'M')+p.X(i)+' '+p.Y(i);
svg.append(svgEl('path',{d,fill:'none',stroke:'var(--thumb)','stroke-width':2.5,'stroke-linecap':'round','stroke-linejoin':'round'}));
svg.append(svgEl('circle',{cx:p.X(0),cy:p.Y(0),r:3,fill:'#2f9e44'}));return svg}
function list(){if(STOP)STOP();const L=document.getElementById('list');L.textContent='';document.getElementById('detail').hidden=true;L.hidden=false;
const real=DATA.rides.filter(r=>r.summary&&r.summary.distance_km>0.1);
if(real.length){const t=el('div','card');const g=el('div','tot');const km=real.reduce((a,r)=>a+r.summary.distance_km,0),mn=real.reduce((a,r)=>a+(r.summary.moving_min||0),0);
for(const [v,l] of [[real.length,'jazd'],[fmt(km,0)+' km','łącznie'],[dur(mn),'w drodze']]){const d=el('div');d.append(el('b',null,String(v)),el('span',null,l));g.append(d)}t.append(g);L.append(t)}
scanCard(L);
if(!DATA.rides.length){L.append(el('div','card mut','Brak jazd na karcie.'));return}
const todo=[];let mon='';const groups=trips();
for(const t of groups){const r0=t.rides[0];const s0=r0.summary;const mk=s0&&s0.start?new Date(s0.start).toLocaleDateString('pl-PL',{month:'long',year:'numeric'}):'bez daty';if(mk!==mon){mon=mk;L.append(el('h2',null,mk))}
L.append(t.rides.length>1?tripCard(t,todo):rideCard(r0,todo))}
(async()=>{for(const [x,th] of todo){try{let tp=[];if(x.rides){for(const r of x.rides.slice().reverse())tp=tp.concat(await thmOf(r))}else tp=await thmOf(x);th.replaceWith(thumb(tp,x.rides?320:96,x.rides?120:72))}catch(e){}}
if(!navigator.onLine)return;for(const [x,th] of todo){if(x.rides)continue;const r=x;if(r.name||r.auto||!r._thm||r._thm.length<2)continue;try{const p=r._thm;const a=await place(p[0][0],p[0][1]),b=await place(p[p.length-1][0],p[p.length-1][1]);if(a||b){r.auto=(a||'?')+' → '+(b||'?');const t=document.getElementById('rt'+r.n);if(t)t.textContent=r.auto}await new Promise(z=>setTimeout(z,1100))}catch(e){break}}})()}
async function thmOf(r){if(!r._thm)r._thm=parse(await text('dl?view=1&f=/rides/'+pad(r.n)+'.thm'));return r._thm}
function rname(r){return r.name||r.auto||when(r.summary)}
async function setName(r,o){const q=new URLSearchParams({n:r.n});if(o.name!==undefined)q.set('name',o.name);if(o.fav!==undefined)q.set('fav',o.fav?'1':'0');if(o.note!==undefined)q.set('note',o.note);const x=await fetch('api/name?'+q,{method:'POST'});if(!x.ok)throw 0;if(o.name!==undefined)r.name=o.name;if(o.fav!==undefined)r.fav=!!o.fav;if(o.note!==undefined)r.note=o.note}
function rideCard(r,todo){const c=el('div','card ride');const s=r.summary;const st=state(r.files,s);const th=el('div','th');c.append(th);const tx=el('div','tx');c.append(tx);
const h=el('div','row');const ttl=el('span','big',(r.fav?'★ ':'')+rname(r));ttl.id='rt'+r.n;h.append(ttl);if(st[0])h.append(el('span','tag '+st[1],st[0]));tx.append(h);if(r.note)tx.append(el('small','mut note1',r.note));
if(!s){tx.append(el('div','mut','jeszcze nie przeliczona'))}
else if(!(s.distance_km>0.1)){tx.append(el('div','mut','postój, bez jazdy'))}
